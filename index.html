<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOVEREIGN ASTRA — Beyond Stars, Beyond Stories</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg-obsidian: #080D19;
      --bg-navy: #101C31;
      --bg-nebula: #1B3555;
      --platinum-silver: #BFCBDA;
      --celestial-blue: #83BFFF;
      --starlight-white: #F1F6FC;
      --surface-glass: rgba(16, 28, 49, 0.72);
      --surface-glass-heavy: rgba(8, 13, 25, 0.9);
      --surface-card: rgba(16, 28, 49, 0.58);
      --border-subtle: rgba(191, 203, 218, 0.12);
      --border-platinum: rgba(191, 203, 218, 0.28);
      --border-celestial: rgba(131, 191, 255, 0.44);
      --grad-platinum: linear-gradient(135deg, #F1F6FC 0%, #BFCBDA 50%, #7B8FA6 100%);
      --grad-celestial: linear-gradient(135deg, #83BFFF 0%, #3B7DD8 100%);
      --grad-hero-fade: linear-gradient(90deg, #080D19 0%, rgba(8, 13, 25, 0.88) 44%, rgba(8, 13, 25, 0.25) 100%);
      --glow-celestial: 0 0 24px rgba(131, 191, 255, 0.24);
      --shadow-elevated: 0 18px 40px rgba(3, 6, 14, 0.68);
      --font-brand: 'Cinzel', Georgia, serif;
      --font-heading: 'Space Grotesk', -apple-system, sans-serif;
      --font-body: 'Inter', -apple-system, sans-serif;
      --sidebar-width: 264px;
      --sidebar-collapsed: 80px;
      --header-height: 72px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --ease-luxury: cubic-bezier(0.22, 1, 0.36, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; background: var(--bg-obsidian); color: var(--starlight-white); font-family: var(--font-body); }
    body {
      min-height: 100vh; background: var(--bg-obsidian);
      background-image:
        radial-gradient(circle at 82% 8%, rgba(27, 53, 85, 0.35) 0%, transparent 45%),
        radial-gradient(circle at 15% 85%, rgba(16, 28, 49, 0.55) 0%, transparent 50%);
      overflow-x: hidden; line-height: 1.55;
    }
    body::before {
      content: ""; position: fixed; inset: 0;
      background-image: radial-gradient(rgba(191, 203, 218, 0.065) 1px, transparent 1px);
      background-size: 36px 36px; pointer-events: none; z-index: 0;
      transition: opacity 0.4s ease;
    }
    body.no-starfield::before { opacity: 0; }
    a { color: inherit; text-decoration: none; }
    button, input, select, textarea { font-family: inherit; color: inherit; background: none; border: none; outline: none; }
    button { cursor: pointer; }
    img { display: block; max-width: 100%; }

    /* Shell & Hybrid Sidebar */
    .app-shell { position: relative; z-index: 1; display: flex; min-height: 100vh; }
    .sidebar {
      position: fixed; top: 0; left: 0; bottom: 0; width: var(--sidebar-width);
      background: var(--surface-glass-heavy); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
      border-right: 1px solid var(--border-subtle); display: flex; flex-direction: column; z-index: 100;
      transition: width 0.35s var(--ease-luxury), transform 0.35s var(--ease-luxury);
    }
    .sidebar.collapsed { width: var(--sidebar-collapsed); }
    .brand-header {
      height: var(--header-height); padding: 0 18px; display: flex; align-items: center;
      justify-content: space-between; border-bottom: 1px solid var(--border-subtle); flex-shrink: 0;
    }
    .brand-link { display: flex; align-items: center; gap: 12px; overflow: hidden; }
    .orbital-logo { width: 36px; height: 36px; flex-shrink: 0; filter: drop-shadow(0 0 10px rgba(131, 191, 255, 0.35)); }
    .brand-text-wrap { display: flex; flex-direction: column; white-space: nowrap; }
    .sidebar.collapsed .brand-text-wrap, .sidebar.collapsed .brand-link, .sidebar.collapsed .nav-label, .sidebar.collapsed .nav-badge, .sidebar.collapsed .astral-status-text { display: none; }
    .brand-wordmark {
      font-family: var(--font-brand); font-size: 0.94rem; font-weight: 700; letter-spacing: 0.15em;
      background: var(--grad-platinum); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .brand-tagline { font-size: 0.6rem; letter-spacing: 0.13em; text-transform: uppercase; color: var(--celestial-blue); }
    .sidebar-toggle-btn {
      width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
      color: var(--platinum-silver); border: 1px solid var(--border-subtle); flex-shrink: 0;
    }
    .sidebar.collapsed .sidebar-toggle-btn { margin: 0 auto; }
    .sidebar-nav { flex: 1; overflow-y: auto; padding: 18px 12px; display: flex; flex-direction: column; gap: 22px; }
    .nav-group-label {
      font-family: var(--font-heading); font-size: 0.67rem; font-weight: 600; letter-spacing: 0.16em;
      text-transform: uppercase; color: rgba(191, 203, 218, 0.48); padding: 0 12px 8px;
    }
    .sidebar.collapsed .nav-group-label { display: none; }
    .nav-list { list-style: none; display: flex; flex-direction: column; gap: 4px; }
    .nav-item {
      position: relative; width: 100%; display: flex; align-items: center; gap: 13px; padding: 11px 14px;
      border-radius: var(--radius-md); color: var(--platinum-silver); font-size: 0.89rem; font-weight: 500;
      transition: all 0.25s var(--ease-luxury); white-space: nowrap;
    }
    .nav-item:hover { color: var(--starlight-white); background: rgba(131, 191, 255, 0.07); }
    .nav-item.active {
      color: var(--starlight-white);
      background: linear-gradient(90deg, rgba(131, 191, 255, 0.16) 0%, rgba(27, 53, 85, 0.25) 100%);
      border: 1px solid var(--border-celestial);
    }
    .nav-item.active::before {
      content: ""; position: absolute; left: 0; top: 22%; bottom: 22%; width: 3px;
      border-radius: 0 4px 4px 0; background: var(--celestial-blue); box-shadow: 0 0 10px var(--celestial-blue);
    }
    .nav-icon { width: 18px; height: 18px; flex-shrink: 0; }
    .nav-item.active .nav-icon { color: var(--celestial-blue); }
    .sidebar.collapsed .nav-item { justify-content: center; padding: 12px; }
    .nav-badge {
      margin-left: auto; font-size: 0.7rem; font-weight: 600; padding: 2px 7px; border-radius: 99px;
      background: rgba(131, 191, 255, 0.14); color: var(--celestial-blue); border: 1px solid rgba(131, 191, 255, 0.25);
    }
    .sidebar-footer { padding: 14px; border-top: 1px solid var(--border-subtle); }
    .astral-status-pill {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--radius-md);
      background: rgba(16, 28, 49, 0.65); border: 1px solid var(--border-subtle); font-size: 0.75rem;
    }
    .sidebar.collapsed .astral-status-pill { justify-content: center; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--celestial-blue); box-shadow: 0 0 10px var(--celestial-blue); flex-shrink: 0; }
    .drawer-backdrop {
      position: fixed; inset: 0; background: rgba(4, 7, 15, 0.74); backdrop-filter: blur(6px);
      z-index: 90; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
    }
    .drawer-backdrop.visible { opacity: 1; pointer-events: auto; }

    /* Main & Header */
    .main-wrapper { flex: 1; margin-left: var(--sidebar-width); min-width: 0; display: flex; flex-direction: column; transition: margin-left 0.35s var(--ease-luxury); }
    body.sidebar-is-collapsed .main-wrapper { margin-left: var(--sidebar-collapsed); }
    .top-header {
      position: sticky; top: 0; height: var(--header-height); padding: 0 28px; display: flex; align-items: center;
      justify-content: space-between; gap: 16px; background: rgba(8, 13, 25, 0.8); backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border-subtle); z-index: 80;
    }
    .header-left { display: flex; align-items: center; gap: 14px; flex: 1; max-width: 520px; }
    .mobile-menu-btn {
      display: none; width: 40px; height: 40px; border-radius: 10px; align-items: center; justify-content: center;
      border: 1px solid var(--border-subtle); background: var(--surface-glass);
    }
    .global-search-box { position: relative; flex: 1; display: flex; align-items: center; }
    .global-search-box svg { position: absolute; left: 14px; width: 16px; height: 16px; color: var(--platinum-silver); opacity: 0.7; pointer-events: none; }
    .global-search-input {
      width: 100%; height: 40px; padding: 0 16px 0 40px; border-radius: 99px;
      background: rgba(16, 28, 49, 0.68); border: 1px solid var(--border-subtle); font-size: 0.86rem;
    }
    .global-search-input:focus { border-color: var(--border-celestial); box-shadow: var(--glow-celestial); }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .header-icon-btn {
      width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      background: rgba(16, 28, 49, 0.68); border: 1px solid var(--border-subtle); color: var(--platinum-silver);
    }
    .header-icon-btn:hover { color: var(--celestial-blue); border-color: var(--border-celestial); }
    .user-chip {
      display: flex; align-items: center; gap: 9px; padding: 5px 13px 5px 6px; border-radius: 99px;
      background: rgba(16, 28, 49, 0.75); border: 1px solid var(--border-subtle);
    }
    .user-chip:hover { border-color: var(--border-celestial); }
    .user-avatar {
      width: 28px; height: 28px; border-radius: 50%; background: var(--grad-celestial); color: var(--bg-obsidian);
      font-family: var(--font-heading); font-weight: 700; font-size: 0.75rem; display: flex; align-items: center; justify-content: center;
    }
    .user-name-label { font-size: 0.8rem; font-weight: 500; }

    /* Viewport & Hero */
    .page-container { flex: 1; padding: 26px 28px 60px; max-width: 1560px; width: 100%; margin: 0 auto; }
    .view-section { animation: cosmicFadeIn 0.4s var(--ease-luxury) forwards; }
    @keyframes cosmicFadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .hero-showcase {
      position: relative; border-radius: var(--radius-lg); overflow: hidden; min-height: 460px;
      display: flex; align-items: flex-end; border: 1px solid var(--border-platinum);
      box-shadow: var(--shadow-elevated); margin-bottom: 40px; background: var(--bg-navy);
    }
    .hero-backdrop { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 22%; }
    .hero-overlay-horizontal { position: absolute; inset: 0; background: var(--grad-hero-fade); }
    .hero-overlay-vertical { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(8, 13, 25, 0.15) 0%, rgba(8, 13, 25, 0.94) 100%); }
    .hero-content { position: relative; z-index: 2; width: 100%; padding: 40px; display: flex; justify-content: space-between; align-items: flex-end; gap: 28px; }
    .hero-info { max-width: 640px; }
    .hero-badge-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 14px; }
    .badge-featured {
      display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 99px;
      font-family: var(--font-heading); font-size: 0.7rem; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; background: rgba(131, 191, 255, 0.16); color: var(--celestial-blue); border: 1px solid var(--border-celestial);
    }
    .hero-meta-pill {
      font-size: 0.76rem; font-weight: 500; color: var(--platinum-silver); padding: 4px 10px;
      border-radius: 6px; background: rgba(8, 13, 25, 0.68); border: 1px solid var(--border-subtle);
    }
    .hero-title {
      font-family: var(--font-heading); font-size: clamp(1.8rem, 3.5vw, 2.95rem); font-weight: 700; line-height: 1.12;
      margin-bottom: 12px; background: linear-gradient(180deg, #FFFFFF 0%, #D4E0EE 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .hero-genres { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .genre-tag {
      font-size: 0.75rem; font-weight: 500; color: var(--celestial-blue); background: rgba(27, 53, 85, 0.58);
      border: 1px solid rgba(131, 191, 255, 0.24); padding: 4px 11px; border-radius: 99px;
    }
    .genre-tag.clickable:hover { background: rgba(131, 191, 255, 0.22); border-color: var(--celestial-blue); }
    .hero-synopsis {
      font-size: 0.92rem; color: rgba(241, 246, 252, 0.84); line-height: 1.65; margin-bottom: 24px;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
    .hero-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
    .btn-primary-luxury {
      display: inline-flex; align-items: center; gap: 9px; padding: 12px 24px; border-radius: 12px;
      background: var(--grad-celestial); color: var(--bg-obsidian); font-family: var(--font-heading);
      font-weight: 700; font-size: 0.9rem; box-shadow: 0 8px 25px rgba(131, 191, 255, 0.35); transition: all 0.25s var(--ease-luxury);
    }
    .btn-primary-luxury:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(131, 191, 255, 0.5); }
    .btn-secondary-glass {
      display: inline-flex; align-items: center; gap: 9px; padding: 12px 20px; border-radius: 12px;
      background: rgba(16, 28, 49, 0.75); backdrop-filter: blur(12px); border: 1px solid var(--border-platinum);
      color: var(--starlight-white); font-family: var(--font-heading); font-weight: 600; font-size: 0.88rem;
    }
    .btn-secondary-glass:hover { border-color: var(--celestial-blue); }
    .btn-secondary-glass.in-library { border-color: var(--celestial-blue); color: var(--celestial-blue); background: rgba(131, 191, 255, 0.12); }
    .btn-danger-glass {
      display: inline-flex; align-items: center; gap: 7px; padding: 9px 15px; border-radius: 10px;
      background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.32);
      color: #FCA5A5; font-size: 0.81rem; font-weight: 600;
    }
    .btn-danger-glass:hover { background: rgba(239, 68, 68, 0.22); }
    .hero-selector { display: flex; gap: 10px; align-items: center; }
    .hero-dot-btn { width: 52px; height: 72px; border-radius: 10px; overflow: hidden; border: 2px solid transparent; opacity: 0.55; transition: all 0.25s ease; flex-shrink: 0; }
    .hero-dot-btn img { width: 100%; height: 100%; object-fit: cover; }
    .hero-dot-btn.active { opacity: 1; border-color: var(--celestial-blue); transform: translateY(-4px); box-shadow: var(--glow-celestial); }

    /* Cards & Grids */
    .catalog-section { margin-bottom: 42px; }
    .section-header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 18px; gap: 16px; }
    .section-eyebrow { font-size: 0.69rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--celestial-blue); display: block; margin-bottom: 3px; }
    .section-title { font-family: var(--font-heading); font-size: 1.35rem; font-weight: 700; color: var(--starlight-white); }
    .section-link { display: inline-flex; align-items: center; gap: 5px; font-size: 0.83rem; color: var(--platinum-silver); }
    .poster-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 20px; }
    .anime-card {
      position: relative; border-radius: var(--radius-md); background: var(--surface-card); border: 1px solid var(--border-subtle);
      overflow: hidden; transition: transform 0.35s var(--ease-luxury), border-color 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer; display: flex; flex-direction: column;
    }
    .anime-card:hover { transform: translateY(-5px); border-color: var(--border-celestial); box-shadow: 0 16px 34px rgba(4, 9, 20, 0.75), 0 0 20px rgba(131, 191, 255, 0.14); }
    .card-poster-wrap { position: relative; aspect-ratio: 2 / 3; overflow: hidden; background: var(--bg-navy); }
    .card-poster { width: 100%; height: 100%; object-fit: cover; transition: transform 0.55s var(--ease-luxury); }
    .anime-card:hover .card-poster { transform: scale(1.06); }
    .card-top-badges { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
    .card-type-badge {
      padding: 3px 8px; border-radius: 6px; font-size: 0.65rem; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; background: rgba(8, 13, 25, 0.8); border: 1px solid var(--border-platinum);
    }
    .card-type-badge.donghua { border-color: var(--border-celestial); color: var(--celestial-blue); }
    .card-rating-badge {
      padding: 3px 8px; border-radius: 6px; font-size: 0.71rem; font-weight: 600;
      background: rgba(8, 13, 25, 0.84); color: #F8D26A; border: 1px solid rgba(248, 210, 106, 0.25);
    }
    .card-rank-badge {
      position: absolute; bottom: 10px; left: 10px; padding: 4px 10px; border-radius: 8px; font-family: var(--font-heading);
      font-size: 0.76rem; font-weight: 700; background: var(--grad-celestial); color: var(--bg-obsidian); z-index: 2;
    }
    .card-hover-overlay {
      position: absolute; inset: 0; background: linear-gradient(180deg, rgba(8, 13, 25, 0.1) 0%, rgba(8, 13, 25, 0.88) 100%);
      display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease;
    }
    .anime-card:hover .card-hover-overlay { opacity: 1; }
    .card-play-circle {
      width: 46px; height: 46px; border-radius: 50%; background: var(--grad-celestial); color: var(--bg-obsidian);
      display: flex; align-items: center; justify-content: center; box-shadow: 0 0 24px rgba(131, 191, 255, 0.6);
    }
    .card-bookmark-btn {
      position: absolute; bottom: 10px; right: 10px; width: 34px; height: 34px; border-radius: 50%;
      background: rgba(8, 13, 25, 0.84); border: 1px solid var(--border-platinum); display: flex;
      align-items: center; justify-content: center; z-index: 3;
    }
    .card-bookmark-btn.saved { background: var(--celestial-blue); color: var(--bg-obsidian); border-color: var(--celestial-blue); }
    .card-body { padding: 13px; display: flex; flex-direction: column; gap: 5px; flex: 1; }
    .card-title { font-family: var(--font-heading); font-size: 0.94rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-genres-line { font-size: 0.71rem; color: var(--celestial-blue); opacity: 0.85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-meta { display: flex; justify-content: space-between; font-size: 0.74rem; color: var(--platinum-silver); opacity: 0.8; margin-top: auto; }
    .continue-banner {
      padding: 20px 24px; border-radius: var(--radius-md);
      background: linear-gradient(135deg, rgba(16, 28, 49, 0.78) 0%, rgba(27, 53, 85, 0.44) 100%);
      border: 1px solid var(--border-subtle); display: flex; align-items: center; justify-content: space-between; gap: 18px; flex-wrap: wrap;
    }

    /* Continue Watching & History Cards */
    .continue-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
    .continue-card {
      display: flex; flex-direction: column; border-radius: var(--radius-md); overflow: hidden;
      background: var(--surface-glass); border: 1px solid var(--border-subtle); transition: all 0.25s var(--ease-luxury);
    }
    .continue-card:hover { border-color: var(--border-celestial); transform: translateY(-3px); }
    .continue-thumb-wrap { position: relative; aspect-ratio: 16 / 9; overflow: hidden; background: var(--bg-navy); cursor: pointer; }
    .continue-thumb-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .continue-progress-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(8, 13, 25, 0.85); }
    .continue-progress-fill { height: 100%; background: var(--grad-celestial); }
    .continue-card-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }

    .history-list { display: flex; flex-direction: column; gap: 12px; }
    .history-row {
      display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 18px;
      border-radius: var(--radius-md); background: var(--surface-glass); border: 1px solid var(--border-subtle); flex-wrap: wrap;
    }
    .history-row:hover { border-color: var(--border-celestial); }

    /* Astral Discover */
    .discover-hero-header {
      padding: 26px 30px; border-radius: var(--radius-lg);
      background: linear-gradient(135deg, rgba(16, 28, 49, 0.82) 0%, rgba(27, 53, 85, 0.45) 100%);
      border: 1px solid var(--border-platinum); margin-bottom: 22px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 18px;
    }
    .discover-controls-panel {
      padding: 20px; border-radius: var(--radius-lg); background: var(--surface-glass);
      backdrop-filter: blur(18px); border: 1px solid var(--border-subtle); margin-bottom: 24px; display: flex; flex-direction: column; gap: 16px;
    }
    .discover-top-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; }
    .category-tabs { display: inline-flex; padding: 4px; border-radius: 12px; background: rgba(8, 13, 25, 0.75); border: 1px solid var(--border-subtle); gap: 4px; }
    .category-tab-btn { padding: 8px 15px; border-radius: 9px; font-family: var(--font-heading); font-size: 0.83rem; font-weight: 600; color: var(--platinum-silver); display: inline-flex; align-items: center; gap: 7px; }
    .category-tab-btn.active { background: var(--grad-celestial); color: var(--bg-obsidian); }
    .tab-count { font-size: 0.71rem; padding: 1px 6px; border-radius: 99px; background: rgba(8, 13, 25, 0.22); }
    .discover-search-wrap { position: relative; flex: 1; min-width: 230px; max-width: 370px; }
    .discover-search-wrap svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--celestial-blue); pointer-events: none; }
    .discover-search-input { width: 100%; height: 40px; padding: 0 36px 0 38px; border-radius: 10px; background: rgba(8, 13, 25, 0.78); border: 1px solid var(--border-platinum); font-size: 0.85rem; }
    .clear-search-btn { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--platinum-silver); }
    .filter-dropdowns-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); gap: 12px; }
    .filter-field { display: flex; flex-direction: column; gap: 5px; }
    .filter-label { font-size: 0.69rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--platinum-silver); opacity: 0.75; }
    .cosmic-select, .cosmic-input { width: 100%; height: 40px; padding: 0 13px; border-radius: 10px; background: rgba(8, 13, 25, 0.85); border: 1px solid var(--border-subtle); font-size: 0.85rem; }
    .cosmic-select { cursor: pointer; }
    .cosmic-input:focus, .cosmic-select:focus { border-color: var(--border-celestial); }
    .cosmic-select option { background: var(--bg-navy); color: var(--starlight-white); }
    .genre-chips-bar { display: flex; align-items: center; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .genre-chip { padding: 6px 13px; border-radius: 99px; font-size: 0.77rem; white-space: nowrap; background: rgba(8, 13, 25, 0.68); border: 1px solid var(--border-subtle); color: var(--platinum-silver); }
    .genre-chip.active { background: rgba(131, 191, 255, 0.16); border-color: var(--celestial-blue); color: var(--celestial-blue); font-weight: 600; }
    .results-status-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; font-size: 0.84rem; color: var(--platinum-silver); }
    .btn-reset-filters { display: inline-flex; align-items: center; gap: 6px; padding: 6px 13px; border-radius: 8px; font-size: 0.79rem; color: var(--celestial-blue); background: rgba(131, 191, 255, 0.1); border: 1px solid rgba(131, 191, 255, 0.28); }

    /* Anime Details & Episode System */
    .detail-back-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
    .btn-back-nav { display: inline-flex; align-items: center; gap: 8px; padding: 8px 15px; border-radius: 10px; background: rgba(16, 28, 49, 0.68); border: 1px solid var(--border-subtle); color: var(--platinum-silver); font-size: 0.84rem; }
    .btn-back-nav:hover { color: var(--starlight-white); border-color: var(--border-celestial); }
    .detail-hero-card { position: relative; border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--border-platinum); box-shadow: var(--shadow-elevated); background: var(--bg-navy); margin-bottom: 34px; }
    .detail-backdrop-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.34; filter: blur(2px); transform: scale(1.03); }
    .detail-backdrop-gradient { position: absolute; inset: 0; background: linear-gradient(135deg, rgba(8, 13, 25, 0.96) 0%, rgba(16, 28, 49, 0.85) 55%, rgba(8, 13, 25, 0.94) 100%); }
    .detail-hero-grid { position: relative; z-index: 2; padding: 36px; display: grid; grid-template-columns: 250px 1fr; gap: 34px; align-items: start; }
    .detail-poster-frame { border-radius: var(--radius-md); overflow: hidden; aspect-ratio: 2 / 3; border: 1px solid var(--border-platinum); box-shadow: 0 20px 44px rgba(0, 0, 0, 0.72); }
    .detail-poster-frame img { width: 100%; height: 100%; object-fit: cover; }
    .detail-main-info { display: flex; flex-direction: column; gap: 13px; }
    .detail-alt-title { font-size: 0.9rem; font-weight: 500; color: var(--celestial-blue); letter-spacing: 0.04em; }
    .detail-title {
      font-family: var(--font-heading); font-size: clamp(1.7rem, 3.2vw, 2.55rem); font-weight: 700; line-height: 1.15;
      background: linear-gradient(180deg, #FFFFFF 0%, #D4E0EE 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .detail-specs-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(125px, 1fr)); gap: 12px; padding: 15px;
      border-radius: var(--radius-md); background: rgba(8, 13, 25, 0.62); border: 1px solid var(--border-subtle);
    }
    .spec-item { display: flex; flex-direction: column; gap: 2px; }
    .spec-label { font-size: 0.67rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--platinum-silver); opacity: 0.65; }
    .spec-value { font-family: var(--font-heading); font-size: 0.92rem; font-weight: 600; color: var(--starlight-white); }
    .detail-synopsis { font-size: 0.93rem; color: rgba(241, 246, 252, 0.86); line-height: 1.7; }

    .episodes-panel { padding: 26px; border-radius: var(--radius-lg); background: var(--surface-glass); backdrop-filter: blur(18px); border: 1px solid var(--border-subtle); margin-bottom: 40px; }
    .episodes-toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 20px; padding-bottom: 14px; border-bottom: 1px solid var(--border-subtle); }
    .episode-search-box { position: relative; width: 250px; max-width: 100%; }
    .episode-search-box svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--platinum-silver); opacity: 0.7; }
    .episode-search-input { width: 100%; height: 38px; padding: 0 14px 0 35px; border-radius: 10px; background: rgba(8, 13, 25, 0.78); border: 1px solid var(--border-subtle); font-size: 0.83rem; }
    .episode-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); gap: 13px; }
    .episode-card {
      display: flex; align-items: center; gap: 13px; padding: 13px 15px; border-radius: var(--radius-md);
      background: rgba(8, 13, 25, 0.68); border: 1px solid var(--border-subtle); text-align: left; transition: all 0.25s var(--ease-luxury);
    }
    .episode-card:hover, .episode-card.active-ep { background: rgba(27, 53, 85, 0.65); border-color: var(--border-celestial); transform: translateY(-2px); }
    .episode-num-box {
      width: 42px; height: 42px; border-radius: 10px; background: rgba(131, 191, 255, 0.12);
      border: 1px solid rgba(131, 191, 255, 0.28); color: var(--celestial-blue); font-family: var(--font-heading);
      font-weight: 700; font-size: 0.9rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .episode-card:hover .episode-num-box, .episode-card.active-ep .episode-num-box { background: var(--grad-celestial); color: var(--bg-obsidian); }
    .episode-info { min-width: 0; flex: 1; }
    .episode-title { font-family: var(--font-heading); font-size: 0.88rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .episode-submeta { font-size: 0.73rem; color: var(--platinum-silver); opacity: 0.75; margin-top: 2px; display: flex; align-items: center; gap: 7px; }

    /* Astral Cinema */
    .cinema-layout { display: grid; grid-template-columns: 1fr 340px; gap: 24px; align-items: start; }
    .cinema-layout.theater-active { grid-template-columns: 1fr; }
    .cinema-stage-card {
      border-radius: var(--radius-lg); overflow: hidden; background: #04070F;
      border: 1px solid var(--border-platinum); box-shadow: 0 24px 60px rgba(0, 0, 0, 0.82), var(--glow-celestial);
    }
    .player-viewport {
      position: relative; width: 100%; aspect-ratio: 16 / 9; background: #02040A; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    .player-viewport video, .player-viewport iframe { width: 100%; height: 100%; border: none; display: block; background: #000; }
    .player-state-overlay {
      position: absolute; inset: 0; background: rgba(6, 10, 20, 0.88); backdrop-filter: blur(10px);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 24px; z-index: 15; gap: 12px;
    }
    .player-state-overlay.hidden { display: none; }
    .orbital-spinner {
      width: 46px; height: 46px; border-radius: 50%; border: 3px solid rgba(131, 191, 255, 0.2);
      border-top-color: var(--celestial-blue); animation: spinOrbit 0.85s linear infinite;
    }
    @keyframes spinOrbit { to { transform: rotate(360deg); } }
    .cinema-subtitle-layer {
      position: absolute; bottom: 68px; left: 50%; transform: translateX(-50%);
      max-width: 82%; padding: 6px 16px; border-radius: 8px;
      background: rgba(4, 7, 15, 0.76); color: var(--starlight-white);
      font-size: clamp(0.84rem, 1.5vw, 1.05rem); text-align: center; pointer-events: none;
      z-index: 10; border: 1px solid rgba(191, 203, 218, 0.14);
    }
    .cinema-subtitle-layer.hidden { display: none; }
    .cinema-hud {
      position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 18px 12px;
      background: linear-gradient(180deg, rgba(4, 7, 15, 0) 0%, rgba(4, 7, 15, 0.94) 100%);
      display: flex; flex-direction: column; gap: 10px; z-index: 12; transition: opacity 0.25s ease;
    }
    .cinema-hud.iframe-mode { background: rgba(8, 13, 25, 0.94); position: relative; border-top: 1px solid var(--border-subtle); }
    .seek-bar-wrap { position: relative; width: 100%; height: 14px; display: flex; align-items: center; cursor: pointer; }
    .seek-track { width: 100%; height: 5px; border-radius: 99px; background: rgba(191, 203, 218, 0.22); overflow: hidden; position: relative; }
    .seek-fill { height: 100%; width: 0%; background: var(--grad-celestial); border-radius: 99px; }
    .hud-controls-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .hud-group { display: flex; align-items: center; gap: 10px; }
    .hud-btn {
      width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
      color: var(--starlight-white); background: rgba(16, 28, 49, 0.72); border: 1px solid var(--border-subtle);
    }
    .hud-btn:hover, .hud-btn.active { border-color: var(--celestial-blue); color: var(--celestial-blue); }
    .hud-timecode { font-family: var(--font-heading); font-size: 0.8rem; color: var(--platinum-silver); white-space: nowrap; }
    .volume-slider { width: 72px; accent-color: var(--celestial-blue); cursor: pointer; }
    .hud-select {
      height: 32px; padding: 0 8px; border-radius: 8px; background: rgba(16, 28, 49, 0.85);
      border: 1px solid var(--border-subtle); font-size: 0.76rem; color: var(--starlight-white); cursor: pointer;
    }
    .cinema-meta-panel { padding: 22px 24px; background: var(--surface-glass); border-top: 1px solid var(--border-subtle); }
    .source-switcher-bar {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
      padding: 14px 16px; border-radius: var(--radius-md); background: rgba(8, 13, 25, 0.72);
      border: 1px solid var(--border-subtle); margin-bottom: 18px;
    }
    .source-pills { display: flex; flex-wrap: wrap; gap: 8px; }
    .source-pill-btn {
      padding: 7px 13px; border-radius: 9px; font-size: 0.79rem; font-weight: 600;
      background: rgba(16, 28, 49, 0.72); border: 1px solid var(--border-subtle); color: var(--platinum-silver);
      display: inline-flex; align-items: center; gap: 6px;
    }
    .source-pill-btn.active { background: var(--grad-celestial); color: var(--bg-obsidian); border-color: var(--celestial-blue); }
    .cinema-sidebar-queue {
      padding: 20px; border-radius: var(--radius-lg); background: var(--surface-glass);
      border: 1px solid var(--border-subtle); max-height: 680px; overflow-y: auto;
    }

    /* Level 6: Personal Space (Profile & Settings) */
    .personal-grid { display: grid; grid-template-columns: 340px 1fr; gap: 24px; align-items: start; }
    .profile-identity-card {
      padding: 28px; border-radius: var(--radius-lg); background: var(--surface-glass);
      border: 1px solid var(--border-platinum); text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px;
    }
    .profile-orbit-avatar {
      width: 92px; height: 92px; border-radius: 50%; background: var(--grad-celestial); color: var(--bg-obsidian);
      font-family: var(--font-brand); font-size: 2rem; font-weight: 800; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 0 6px rgba(131, 191, 255, 0.14), var(--glow-celestial);
    }
    .stats-quad-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 24px; }
    .stat-box {
      padding: 18px; border-radius: var(--radius-md); background: var(--surface-glass); border: 1px solid var(--border-subtle);
      display: flex; flex-direction: column; gap: 4px;
    }
    .stat-num { font-family: var(--font-heading); font-size: 1.65rem; font-weight: 700; color: var(--celestial-blue); }
    .stat-title { font-size: 0.78rem; color: var(--platinum-silver); opacity: 0.82; }
    .settings-card {
      padding: 24px; border-radius: var(--radius-lg); background: var(--surface-glass);
      border: 1px solid var(--border-subtle); margin-bottom: 20px; display: flex; flex-direction: column; gap: 18px;
    }
    .setting-row {
      display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-bottom: 16px;
      border-bottom: 1px solid var(--border-subtle); flex-wrap: wrap;
    }
    .setting-row:last-child { border-bottom: none; padding-bottom: 0; }
    .toggle-switch {
      position: relative; width: 48px; height: 26px; border-radius: 99px; background: rgba(8, 13, 25, 0.85);
      border: 1px solid var(--border-platinum); transition: all 0.25s ease; flex-shrink: 0;
    }
    .toggle-switch::after {
      content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%;
      background: var(--platinum-silver); transition: transform 0.25s ease, background 0.25s ease;
    }
    .toggle-switch.on { background: rgba(131, 191, 255, 0.25); border-color: var(--celestial-blue); }
    .toggle-switch.on::after { transform: translateX(22px); background: var(--celestial-blue); }

    /* Release Schedule & Empty State */
    .day-selector-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 22px; }
    .day-pill-btn { padding: 9px 16px; border-radius: 12px; background: rgba(16, 28, 49, 0.68); border: 1px solid var(--border-subtle); color: var(--platinum-silver); font-family: var(--font-heading); font-size: 0.84rem; font-weight: 600; white-space: nowrap; }
    .day-pill-btn.active { background: var(--grad-celestial); color: var(--bg-obsidian); border-color: var(--celestial-blue); }
    .schedule-list { display: flex; flex-direction: column; gap: 12px; }
    .schedule-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 15px 18px; border-radius: var(--radius-md); background: var(--surface-glass); border: 1px solid var(--border-subtle); cursor: pointer; }
    .schedule-row:hover { border-color: var(--border-celestial); }
    .stage-panel { padding: 34px; border-radius: var(--radius-lg); background: var(--surface-glass); border: 1px solid var(--border-platinum); text-align: center; max-width: 660px; margin: 36px auto; }
    .stage-icon-ring { width: 60px; height: 60px; margin: 0 auto 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(131, 191, 255, 0.12); border: 1px solid var(--border-celestial); color: var(--celestial-blue); }

    /* Toasts & Footer */
    .toast-container { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 9px; z-index: 999; pointer-events: none; }
    .toast-item {
      pointer-events: auto; display: flex; align-items: center; gap: 11px; padding: 12px 16px; border-radius: 12px;
      background: rgba(16, 28, 49, 0.95); backdrop-filter: blur(16px); border: 1px solid var(--border-celestial);
      font-size: 0.84rem; box-shadow: var(--shadow-elevated); animation: toastIn 0.3s var(--ease-luxury);
    }
    @keyframes toastIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
    .app-footer { margin-top: auto; padding: 24px 28px; border-top: 1px solid var(--border-subtle); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; font-size: 0.78rem; color: rgba(191, 203, 218, 0.6); }

    @media (max-width: 1120px) {
      .cinema-layout { grid-template-columns: 1fr; }
    }
    @media (max-width: 1024px) {
      .hero-content { flex-direction: column; align-items: flex-start; padding: 28px; }
      .detail-hero-grid { grid-template-columns: 200px 1fr; padding: 26px; gap: 22px; }
      .personal-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); width: 272px !important; }
      .sidebar.mobile-open { transform: translateX(0); }
      .sidebar-toggle-btn { display: none; }
      .main-wrapper, body.sidebar-is-collapsed .main-wrapper { margin-left: 0; }
      .mobile-menu-btn { display: flex; }
      .top-header { padding: 0 16px; }
      .page-container { padding: 18px 16px 46px; }
      .hero-showcase { min-height: 410px; }
      .hero-content { padding: 22px 18px; }
      .detail-hero-grid { grid-template-columns: 1fr; padding: 20px 16px; }
      .detail-poster-frame { max-width: 180px; margin: 0 auto; }
      .episodes-panel, .cinema-meta-panel, .settings-card { padding: 18px 14px; }
      .volume-slider { display: none; }
      .user-name-label { display: none; }
      .poster-grid { grid-template-columns: repeat(2, 1fr); gap: 13px; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="drawer-backdrop" id="drawerBackdrop"></div>

    <aside class="sidebar" id="appSidebar" aria-label="Primary Navigation">
      <div class="brand-header">
        <a href="#home" class="brand-link" data-route="home">
          <svg class="orbital-logo" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="platinumRing" x1="6" y1="6" x2="58" y2="58" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#F1F6FC"/>
                <stop offset="50%" stop-color="#BFCBDA"/>
                <stop offset="100%" stop-color="#83BFFF"/>
              </linearGradient>
              <radialGradient id="celestialCore" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#FFFFFF"/>
                <stop offset="55%" stop-color="#83BFFF"/>
                <stop offset="100%" stop-color="#1B3555" stop-opacity="0"/>
              </radialGradient>
            </defs>
            <circle cx="32" cy="32" r="26" stroke="url(#platinumRing)" stroke-width="1.4" stroke-opacity="0.65"/>
            <ellipse cx="32" cy="32" rx="28" ry="11" transform="rotate(-28 32 32)" stroke="url(#platinumRing)" stroke-width="1.6"/>
            <ellipse cx="32" cy="32" rx="28" ry="11" transform="rotate(28 32 32)" stroke="#83BFFF" stroke-width="1.1" stroke-opacity="0.7"/>
            <circle cx="32" cy="32" r="8" fill="url(#celestialCore)"/>
            <path d="M32 19L34.3 29.7L45 32L34.3 34.3L32 45L29.7 34.3L19 32L29.7 29.7L32 19Z" fill="#F1F6FC"/>
            <circle cx="53" cy="20" r="2.6" fill="#83BFFF"/>
          </svg>
          <div class="brand-text-wrap">
            <span class="brand-wordmark">SOVTRA</span>
            <span class="brand-tagline">Beyond Stars, Beyond Stories</span>
          </div>
        </a>
        <button class="sidebar-toggle-btn" id="sidebarCollapseBtn" title="Toggle Sidebar">
          <i data-lucide="panel-left-close" style="width:16px;height:16px;"></i>
        </button>
      </div>

      <nav class="sidebar-nav">
        <div>
          <div class="nav-group-label">Jelajahi Semesta</div>
          <ul class="nav-list">
            <li><button class="nav-item active" data-route="home"><i data-lucide="compass" class="nav-icon"></i><span class="nav-label">Home</span></button></li>
            <li><button class="nav-item" data-route="discover"><i data-lucide="sparkles" class="nav-icon"></i><span class="nav-label">Astral Discover</span></button></li>
            <li><button class="nav-item" data-route="trending"><i data-lucide="flame" class="nav-icon"></i><span class="nav-label">Trending</span></button></li>
            <li><button class="nav-item" data-route="schedule"><i data-lucide="calendar-clock" class="nav-icon"></i><span class="nav-label">Release Schedule</span></button></li>
          </ul>
        </div>
        <div>
          <div class="nav-group-label">Koleksimu</div>
          <ul class="nav-list">
            <li><button class="nav-item" data-route="library"><i data-lucide="bookmark" class="nav-icon"></i><span class="nav-label">Celestial Library</span><span class="nav-badge" id="watchlistCountBadge">0</span></button></li>
            <li><button class="nav-item" data-route="history"><i data-lucide="history" class="nav-icon"></i><span class="nav-label">Watch History</span></button></li>
            <li><button class="nav-item" data-route="continue"><i data-lucide="play-circle" class="nav-icon"></i><span class="nav-label">Continue Watching</span></button></li>
          </ul>
        </div>
        <div>
          <div class="nav-group-label">Ruang Pribadi</div>
          <ul class="nav-list">
            <li><button class="nav-item" data-route="profile"><i data-lucide="user-check" class="nav-icon"></i><span class="nav-label">My Profile</span></button></li>
            <li><button class="nav-item" data-route="settings"><i data-lucide="sliders-horizontal" class="nav-icon"></i><span class="nav-label">Settings</span></button></li>
          </ul>
        </div>
      </nav>

      <div class="sidebar-footer">
        <div class="astral-status-pill">
          <span class="status-dot"></span>
          <div class="astral-status-text">
            <div style="color:var(--starlight-white);font-weight:600;">Cosmic Core v6.0</div>
            <div style="font-size:0.68rem;opacity:0.7;">Complete Edition</div>
          </div>
        </div>
      </div>
    </aside>

    <div class="main-wrapper">
      <header class="top-header">
        <div class="header-left">
          <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open Navigation">
            <i data-lucide="menu" style="width:20px;height:20px;"></i>
          </button>
          <div class="global-search-box">
            <i data-lucide="search"></i>
            <input type="search" id="headerSearchInput" class="global-search-input" placeholder="Search anime, donghua, genres..." />
          </div>
        </div>
        <div class="header-right">

    /* 03. STORAGE MANAGER */
    const StorageManager = {
      get(key, fallback = []) {
        try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
        catch (err) { return fallback; }
      },
      set(key, value) {
        try { localStorage.setItem(key, JSON.stringify(value)); return true; }
        catch (err) { return false; }
      }
    };

    /* 04. SETTINGS & PROFILE MANAGER (LEVEL 6) */
    const SettingsManager = {
      defaults: {
        displayName: "Astral Voyager",
        bio: "Menjelajahi konstelasi cerita Anime & Donghua di tepi galaksi.",
        defaultSource: "direct-mp4",
        defaultSubtitle: "id",
        autoNext: true,
        starfieldEnabled: true
      },
      get() {
        return { ...this.defaults, ...StorageManager.get(AppConfig.storageKeys.settings, {}) };
      },
      update(partial) {
        const next = { ...this.get(), ...partial };
        StorageManager.set(AppConfig.storageKeys.settings, next);
        this.applyToDOM();
        return next;
      },
      getInitials(name) {
        const parts = (name || "AV").trim().split(/\s+/);
        if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
        return (parts[0][0] + parts[1][0]).toUpperCase();
      },
      applyToDOM() {
        const cfg = this.get();
        document.body.classList.toggle("no-starfield", !cfg.starfieldEnabled);
        const nameEl = document.getElementById("headerUserName");
        const avatarEl = document.getElementById("headerUserAvatar");
        if (nameEl) nameEl.textContent = cfg.displayName;
        if (avatarEl) avatarEl.textContent = this.getInitials(cfg.displayName);
      },
      exportBackup() {
        const payload = {
          app: AppConfig.appName,
          version: AppConfig.version,
          exportedAt: new Date().toISOString(),
          settings: this.get(),
          watchlist: WatchlistManager.getAll(),
          history: HistoryManager.getAll(),
          continueWatching: ContinueWatchingManager.getAll()
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `sovereign-astra-backup-${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        NotificationManager.show("File backup JSON berhasil diunduh.", "download");
      },
      importBackup(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const parsed = JSON.parse(e.target.result);
            if (parsed.settings) StorageManager.set(AppConfig.storageKeys.settings, { ...this.defaults, ...parsed.settings });
            if (Array.isArray(parsed.watchlist)) StorageManager.set(AppConfig.storageKeys.watchlist, parsed.watchlist);
            if (Array.isArray(parsed.history)) StorageManager.set(AppConfig.storageKeys.history, parsed.history);
            if (Array.isArray(parsed.continueWatching)) StorageManager.set(AppConfig.storageKeys.continueWatching, parsed.continueWatching);
            this.applyToDOM();
            WatchlistManager.updateBadge();
            NotificationManager.show("Data backup berhasil dipulihkan!", "check-circle-2");
            RouterManager.navigate(RouterManager.currentRoute);
          } catch (err) {
            NotificationManager.show("Format file JSON tidak valid.", "alert-triangle");
          }
        };
        reader.readAsText(file);
      },
      factoryReset() {
        Object.values(AppConfig.storageKeys).forEach(k => localStorage.removeItem(k));
        this.applyToDOM();
        WatchlistManager.updateBadge();
        NotificationManager.show("Seluruh data lokal telah dikembalikan ke pengaturan awal.", "rotate-ccw");
        RouterManager.navigate("home");
      }
    };

    /* 05. WATCHLIST MANAGER */
    const WatchlistManager = {
      getAll() { return StorageManager.get(AppConfig.storageKeys.watchlist, []); },
      has(animeId) { return this.getAll().includes(animeId); },
      toggle(animeId) {
        const list = this.getAll();
        const index = list.indexOf(animeId);
        let added = false;
        if (index === -1) { list.unshift(animeId); added = true; }
        else { list.splice(index, 1); added = false; }
        StorageManager.set(AppConfig.storageKeys.watchlist, list);
        this.updateBadge();
        return added;
      },
      updateBadge() {
        const badge = document.getElementById("watchlistCountBadge");
        if (badge) badge.textContent = this.getAll().length;
      }
    };

    /* 06. HISTORY & CONTINUE WATCHING MANAGERS */
    const HistoryManager = {
      getAll() { return StorageManager.get(AppConfig.storageKeys.history, []); },
      record(animeId, episodeNumber, sourceLabel = "Astra Direct CDN") {
        const list = this.getAll();
        const filtered = list.filter(entry => !(entry.animeId === animeId && entry.episode === Number(episodeNumber)));
        filtered.unshift({
          animeId,
          episode: Number(episodeNumber),
          sourceLabel,
          watchedAt: new Date().toISOString()
        });
        StorageManager.set(AppConfig.storageKeys.history, filtered.slice(0, 60));
      },
      hasWatched(animeId, episodeNumber) {
        return this.getAll().some(e => e.animeId === animeId && e.episode === Number(episodeNumber));
      },
      remove(animeId, episodeNumber) {
        const filtered = this.getAll().filter(e => !(e.animeId === animeId && e.episode === Number(episodeNumber)));
        StorageManager.set(AppConfig.storageKeys.history, filtered);
      },
      clearAll() {
        StorageManager.set(AppConfig.storageKeys.history, []);
      },
      formatRelativeTime(isoStr) {
        try {
          const diffMs = Date.now() - new Date(isoStr).getTime();
          const mins = Math.floor(diffMs / 60000);
          if (mins < 1) return "Baru saja";
          if (mins < 60) return `${mins} menit lalu`;
          const hours = Math.floor(mins / 60);
          if (hours < 24) return `${hours} jam lalu`;
          const days = Math.floor(hours / 24);
          return `${days} hari lalu`;
        } catch (e) {
          return "Baru saja";
        }
      }
    };

    const ContinueWatchingManager = {
      getAll() { return StorageManager.get(AppConfig.storageKeys.continueWatching, []); },
      getProgress(animeId, episodeNumber) {
        return this.getAll().find(item => item.animeId === animeId && item.episode === Number(episodeNumber)) || null;
      },
      saveProgress(animeId, episodeNumber, currentTime = 0, duration = 0) {
        const list = this.getAll().filter(item => item.animeId !== animeId);
        const pct = duration > 0 ? Math.min(100, Math.max(5, Math.round((currentTime / duration) * 100))) : 15;
        list.unshift({
          animeId,
          episode: Number(episodeNumber),
          currentTime: Math.floor(currentTime),
          duration: Math.floor(duration),
          percent: pct,
          updatedAt: new Date().toISOString()
        });
        StorageManager.set(AppConfig.storageKeys.continueWatching, list.slice(0, 24));
      },
      remove(animeId) {
        const filtered = this.getAll().filter(item => item.animeId !== animeId);
        StorageManager.set(AppConfig.storageKeys.continueWatching, filtered);
      },
      clearAll() {
        StorageManager.set(AppConfig.storageKeys.continueWatching, []);
      }
    };

    /* 07. NOTIFICATION MANAGER */
    const NotificationManager = {
      show(message, iconName = "sparkles") {
        const container = document.getElementById("toastContainer");
        if (!container) return;
        const toast = document.createElement("div");
        toast.className = "toast-item";
        toast.innerHTML = `<i data-lucide="${iconName}" style="width:17px;height:17px;color:var(--celestial-blue);flex-shrink:0;"></i><span>${message}</span>`;
        container.appendChild(toast);
        if (window.lucide) window.lucide.createIcons({ nodes: [toast] });
        setTimeout(() => {
          toast.style.opacity = "0"; toast.style.transform = "translateX(20px)"; toast.style.transition = "all 0.3s ease";
          setTimeout(() => toast.remove(), 320);
        }, 2800);
      }
    };

    /* 08. SEARCH & FILTER MANAGER */
    const SearchManager = {
      matches(anime, query) {
        if (!query || !query.trim()) return true;
        const q = query.trim().toLowerCase();
        return (
          anime.title.toLowerCase().includes(q) ||
          anime.altTitle.toLowerCase().includes(q) ||
          anime.type.toLowerCase().includes(q) ||
          anime.synopsis.toLowerCase().includes(q) ||
          anime.genres.some(g => g.toLowerCase().includes(q))
        );
      }
    };

    const FilterManager = {
      state: { query: "", category: "ALL", genre: "ALL", year: "ALL", status: "ALL", sortBy: "popularity" },
      getAllGenres() {
        const set = new Set();
        AnimeDB.forEach(item => item.genres.forEach(g => set.add(g)));
        return Array.from(set).sort();
      },
      getAllYears() {
        const set = new Set(AnimeDB.map(item => item.year));
        return Array.from(set).sort((a, b) => b - a);
      },
      reset() {
        this.state = { query: "", category: "ALL", genre: "ALL", year: "ALL", status: "ALL", sortBy: "popularity" };
        const headerInput = document.getElementById("headerSearchInput");
        if (headerInput) headerInput.value = "";
      },
      hasActiveFilters() {
        const s = this.state;
        return s.query.trim() !== "" || s.category !== "ALL" || s.genre !== "ALL" || s.year !== "ALL" || s.status !== "ALL";
      },
      apply() {
        const { query, category, genre, year, status, sortBy } = this.state;
        const filtered = AnimeDB.filter(anime => {
          if (!SearchManager.matches(anime, query)) return false;
          if (category !== "ALL" && anime.type !== category) return false;
          if (genre !== "ALL" && !anime.genres.includes(genre)) return false;
          if (year !== "ALL" && String(anime.year) !== String(year)) return false;
          if (status !== "ALL" && anime.status !== status) return false;
          return true;
        });
        return filtered.sort((a, b) => {
          switch (sortBy) {
            case "latest": return b.year !== a.year ? b.year - a.year : (b.recent ? 1 : 0) - (a.recent ? 1 : 0);
            case "rating": return b.rating - a.rating;
            case "title": return a.title.localeCompare(b.title);
            default: return b.popularityScore - a.popularityScore;
          }
        });
      }
    };

                    <div style="font-size:0.78rem;color:var(--platinum-silver);">Menyelaraskan stream orbital</div>
                  </div>

                  <div class="player-state-overlay hidden" id="playerErrorOverlay">
                    <i data-lucide="alert-triangle" style="width:36px;height:36px;color:#F8D26A;"></i>
                    <div style="font-family:var(--font-heading);font-weight:600;font-size:1.05rem;">Transmission Interrupted</div>
                    <div id="playerErrorText" style="font-size:0.82rem;color:var(--platinum-silver);max-width:420px;">
                      Sumber stream saat ini tidak merespons atau dibatasi oleh kebijakan jaringan.
                    </div>
                    <button class="btn-primary-luxury" id="playerFallbackBtn" style="padding:10px 18px;font-size:0.84rem;">
                      Switch to Fallback Source
                    </button>
                  </div>

                  ${activeSource.supportsCustomHud ? `
                    <video id="astralHtml5Video" playsinline preload="metadata" poster="${anime.backdrop}"></video>
                    <div class="cinema-subtitle-layer ${this.subtitleLang === "off" ? "hidden" : ""}" id="cinemaSubtitleLayer">
                      ${this.subtitleLang === "id"
                        ? `[Sub ID] ${anime.title} — Episode ${String(this.activeEpisode).padStart(2, "0")}: "${currentEpObj.title}"`
                        : `[Sub EN] ${anime.title} — Episode ${String(this.activeEpisode).padStart(2, "0")}: "${currentEpObj.title}"`}
                    </div>
                  ` : `
                    <iframe
                      id="astralEmbedIframe"
                      src="${activeSource.url}"
                      title="${anime.title} - ${currentEpObj.code}"
                      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
                      allowfullscreen
                    ></iframe>
                  `}

                  ${activeSource.supportsCustomHud ? `
                    <div class="cinema-hud" id="cinemaCustomHud">
                      <div class="seek-bar-wrap" id="cinemaSeekWrap" title="Seek">
                        <div class="seek-track"><div class="seek-fill" id="cinemaSeekFill"></div></div>
                      </div>
                      <div class="hud-controls-row">
                        <div class="hud-group">
                          <button class="hud-btn" id="hudPlayPauseBtn" title="Play / Pause"><i data-lucide="play" style="width:16px;height:16px;"></i></button>
                          <button class="hud-btn" id="hudMuteBtn" title="Mute / Unmute"><i data-lucide="volume-2" style="width:16px;height:16px;"></i></button>
                          <input type="range" id="hudVolumeSlider" class="volume-slider" min="0" max="1" step="0.05" value="0.85" aria-label="Volume" />
                          <span class="hud-timecode" id="hudTimecode">00:00 / 00:00</span>
                        </div>
                        <div class="hud-group">
                          <select id="hudSubtitleSelect" class="hud-select" title="Subtitles">
                            <option value="id" ${this.subtitleLang === "id" ? "selected" : ""}>Sub: Indonesia</option>
                            <option value="en" ${this.subtitleLang === "en" ? "selected" : ""}>Sub: English</option>
                            <option value="off" ${this.subtitleLang === "off" ? "selected" : ""}>Sub: Off</option>
                          </select>
                          <select id="hudSpeedSelect" class="hud-select" title="Playback Speed">
                            <option value="0.75">0.75x</option>
                            <option value="1" selected>1.0x</option>
                            <option value="1.25">1.25x</option>
                            <option value="1.5">1.5x</option>
                            <option value="2">2.0x</option>
                          </select>
                          <button class="hud-btn ${this.theaterMode ? "active" : ""}" id="hudTheaterBtn" title="Theater Mode"><i data-lucide="rectangle-horizontal" style="width:16px;height:16px;"></i></button>
                          <button class="hud-btn" id="hudFullscreenBtn" title="Fullscreen"><i data-lucide="maximize" style="width:16px;height:16px;"></i></button>
                        </div>
                      </div>
                    </div>
                  ` : ""}
                </div>

                ${!activeSource.supportsCustomHud ? `
                  <div class="cinema-hud iframe-mode">
                    <div class="hud-controls-row">
                      <div style="font-size:0.8rem;color:var(--platinum-silver);">
                        <strong style="color:var(--celestial-blue);">${activeSource.providerName}</strong> aktif — Gunakan kontrol pemutar bawaan provider di atas.
                      </div>
                      <div class="hud-group">
                        <button class="hud-btn ${this.theaterMode ? "active" : ""}" id="hudTheaterBtn" title="Theater Mode"><i data-lucide="rectangle-horizontal" style="width:16px;height:16px;"></i></button>
                        <button class="hud-btn" id="hudFullscreenBtn" title="Fullscreen"><i data-lucide="maximize" style="width:16px;height:16px;"></i></button>
                      </div>
                    </div>
                  </div>
                ` : ""}

                <div class="cinema-meta-panel">
                  <div class="source-switcher-bar">
                    <div>
                      <div style="font-size:0.7rem;text-transform:uppercase;letter-spacing:0.14em;color:var(--celestial-blue);font-weight:600;">Video Source Manager</div>
                      <div style="font-size:0.8rem;color:var(--platinum-silver);">Pilih server atau provider pemutaran resmi:</div>
                    </div>
                    <div class="source-pills">
                      ${sources.map(src => `
                        <button class="source-pill-btn ${src.id === activeSource.id ? "active" : ""}" data-switch-source="${src.id}">
                          <i data-lucide="${src.engine === "iframe" ? "tv" : "play-circle"}" style="width:14px;height:14px;"></i>
                          ${src.label}
                        </button>
                      `).join("")}
                    </div>
                  </div>

                  <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;">
                    <div>
                      <span class="section-eyebrow">${anime.title}</span>
                      <h1 style="font-family:var(--font-heading);font-size:1.4rem;font-weight:700;">
                        Episode ${String(this.activeEpisode).padStart(2, "0")} — ${currentEpObj.title}
                      </h1>
                    </div>

                    <div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px;">
                      <button class="btn-secondary-glass" id="cinemaPrevEpBtn" style="padding:9px 15px;font-size:0.82rem;" ${this.activeEpisode <= 1 ? "disabled style='opacity:0.45;cursor:not-allowed;padding:9px 15px;font-size:0.82rem;'" : ""}>
                        <i data-lucide="skip-back" style="width:15px;height:15px;"></i> Prev
                      </button>
                      <button class="btn-secondary-glass ${this.autoNext ? "in-library" : ""}" id="cinemaAutoNextBtn" style="padding:9px 15px;font-size:0.82rem;">
                        <i data-lucide="repeat" style="width:15px;height:15px;"></i> Auto-Next: ${this.autoNext ? "ON" : "OFF"}
                      </button>
                      <button class="btn-primary-luxury" id="cinemaNextEpBtn" style="padding:9px 17px;font-size:0.82rem;" ${this.activeEpisode >= anime.episodes ? "disabled style='opacity:0.45;cursor:not-allowed;padding:9px 17px;font-size:0.82rem;'" : ""}>
                        Next <i data-lucide="skip-forward" style="width:15px;height:15px;"></i>
                      </button>
                    </div>
                  </div>
                </div>
              </div>

              <aside class="cinema-sidebar-queue" aria-label="Episode Queue">
                <div style="margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border-subtle);">
                  <span class="section-eyebrow">Playlist Queue</span>
                  <h2 style="font-family:var(--font-heading);font-size:1.1rem;font-weight:700;">All Episodes (${anime.episodes})</h2>
                </div>
                <div style="display:flex;flex-direction:column;gap:9px;">
                  ${episodes.map(ep => `
                    <button class="episode-card ${ep.number === this.activeEpisode ? "active-ep" : ""}" data-play-episode="${ep.number}" data-id="${anime.id}" style="padding:10px 12px;">
                      <div class="episode-num-box" style="width:36px;height:36px;font-size:0.82rem;">${String(ep.number).padStart(2, "0")}</div>
                      <div class="episode-info">
                        <div class="episode-title" style="font-size:0.83rem;">${ep.title}</div>
                        <div class="episode-submeta">${ep.duration}</div>
                      </div>
                    </button>
                  `).join("")}
                </div>
              </aside>
            </div>
          </div>
        `;
      },

      mountEngine() {
        const anime = AnimeDetailManager.getById(this.activeAnimeId);
        const sources = VideoSourceManager.getSourcesForEpisode(anime.id, this.activeEpisode);
        const activeSource = sources.find(s => s.id === this.activeSourceId) || sources[0];

        const loadingEl = document.getElementById("playerLoadingOverlay");
        const errorEl = document.getElementById("playerErrorOverlay");
        const showError = (msg) => {
          if (loadingEl) loadingEl.classList.add("hidden");
          if (errorEl) {
            errorEl.classList.remove("hidden");
            const txt = document.getElementById("playerErrorText");
            if (txt && msg) txt.textContent = msg;
          }
        };

        if (activeSource.engine === "iframe") {
          const iframe = document.getElementById("astralEmbedIframe");
          if (iframe) {
            iframe.addEventListener("load", () => loadingEl?.classList.add("hidden"));
            setTimeout(() => loadingEl?.classList.add("hidden"), 1800);
          }
          return;
        }

        const video = document.getElementById("astralHtml5Video");
        if (!video) return;

        if (activeSource.engine === "hls") {
          if (window.Hls && window.Hls.isSupported()) {
            this.hlsInstance = new window.Hls();
            this.hlsInstance.loadSource(activeSource.url);
            this.hlsInstance.attachMedia(video);
            this.hlsInstance.on(window.Hls.Events.MANIFEST_PARSED, () => {
              loadingEl?.classList.add("hidden");
              video.play().catch(() => {});
            });
            this.hlsInstance.on(window.Hls.Events.ERROR, (_, data) => {
              if (data.fatal) showError("Stream HLS mengalami gangguan. Silakan beralih ke Source A (Direct HD) atau YouTube.");
            });
          } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
            video.src = activeSource.url;
          } else {
            showError("Browser perangkat ini tidak mendukung HLS.js. Gunakan fallback source.");
          }
        } else {
          video.src = activeSource.url;
        }

        video.addEventListener("loadedmetadata", () => {
          loadingEl?.classList.add("hidden");
          const saved = ContinueWatchingManager.getProgress(anime.id, this.activeEpisode);
          if (saved && saved.currentTime > 5 && saved.currentTime < (video.duration - 10)) {
            video.currentTime = saved.currentTime;
            NotificationManager.show(`Melanjutkan dari ${this.formatTime(saved.currentTime)}`, "play-circle");
          }
          this.updateTimecode(video);
          video.play().catch(() => {});
        });

        video.addEventListener("canplay", () => loadingEl?.classList.add("hidden"));
        video.addEventListener("error", () => showError("Gagal memuat berkas video dari server CDN. Klik tombol di bawah untuk berpindah ke fallback source."));
        video.addEventListener("timeupdate", () => {
          this.updateTimecode(video);
          if (Math.abs(video.currentTime - this.lastSavedSecond) >= 5 && video.duration > 0) {
            this.lastSavedSecond = video.currentTime;
            ContinueWatchingManager.saveProgress(anime.id, this.activeEpisode, video.currentTime, video.duration);
          }
        });
        video.addEventListener("play", () => this.syncPlayIcon(true));
        video.addEventListener("pause", () => {
          this.syncPlayIcon(false);
          if (video.duration > 0) {
            ContinueWatchingManager.saveProgress(anime.id, this.activeEpisode, video.currentTime, video.duration);
          }
        });
        video.addEventListener("ended", () => {
          ContinueWatchingManager.saveProgress(anime.id, this.activeEpisode, video.duration, video.duration);
          if (this.autoNext && this.activeEpisode < anime.episodes) {
            NotificationManager.show(`Auto-Next: Memutar Episode ${String(this.activeEpisode + 1).padStart(2, "0")}...`, "skip-forward");
            this.open(anime.id, this.activeEpisode + 1);
          }
        });

        this.bindCustomHudControls(video);
      },

      updateTimecode(video) {
        const timeEl = document.getElementById("hudTimecode");
        const fillEl = document.getElementById("cinemaSeekFill");
        if (timeEl) timeEl.textContent = `${this.formatTime(video.currentTime)} / ${this.formatTime(video.duration)}`;
        if (fillEl && video.duration) {
          fillEl.style.width = `${Math.min(100, (video.currentTime / video.duration) * 100)}%`;
        }
      },

      syncPlayIcon(isPlaying) {
        const btn = document.getElementById("hudPlayPauseBtn");
        if (!btn) return;
        btn.innerHTML = `<i data-lucide="${isPlaying ? "pause" : "play"}" style="width:16px;height:16px;"></i>`;
        if (window.lucide) window.lucide.createIcons({ nodes: [btn] });
      },

      bindCustomHudControls(video) {
        document.getElementById("hudPlayPauseBtn")?.addEventListener("click", () => {
          if (video.paused) video.play().catch(() => {});
          else video.pause();
        });

        video.addEventListener("click", () => {
          if (video.paused) video.play().catch(() => {});
          else video.pause();
        });

        document.getElementById("cinemaSeekWrap")?.addEventListener("click", (e) => {
          if (!video.duration) return;
          const rect = e.currentTarget.getBoundingClientRect();
          const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
          video.currentTime = ratio * video.duration;
        });

        document.getElementById("hudVolumeSlider")?.addEventListener("input", (e) => {
          video.volume = Number(e.target.value);
          video.muted = video.volume === 0;
        });

        document.getElementById("hudMuteBtn")?.addEventListener("click", () => {
          video.muted = !video.muted;
          NotificationManager.show(video.muted ? "Audio Muted" : "Audio Unmuted", video.muted ? "volume-x" : "volume-2");
        });

        document.getElementById("hudSpeedSelect")?.addEventListener("change", (e) => {
          video.playbackRate = Number(e.target.value);
          NotificationManager.show(`Playback Speed: ${e.target.value}x`, "gauge");
        });

        document.getElementById("hudSubtitleSelect")?.addEventListener("change", (e) => {
          this.subtitleLang = e.target.value;
          const subLayer = document.getElementById("cinemaSubtitleLayer");
          if (subLayer) {
            if (this.subtitleLang === "off") subLayer.classList.add("hidden");
            else {
              subLayer.classList.remove("hidden");
              const anime = AnimeDetailManager.getById(this.activeAnimeId);
              subLayer.textContent = `[Sub ${this.subtitleLang.toUpperCase()}] ${anime.title} — Episode ${String(this.activeEpisode).padStart(2, "0")}`;
            }
          }
        });
      },

      switchToFallback() {
        const idx = VideoSourceManager.providers.findIndex(p => p.id === this.activeSourceId);
        const nextProvider = VideoSourceManager.providers[(idx + 1) % VideoSourceManager.providers.length];
        this.cleanup();
        this.activeSourceId = nextProvider.id;
        HistoryManager.record(this.activeAnimeId, this.activeEpisode, nextProvider.providerName);
        NotificationManager.show(`Beralih ke ${nextProvider.providerName}`, "refresh-cw");
        RouterManager.navigate("cinema");
      }
    };

    /* 11. ANIME DETAIL MANAGER */
    const AnimeDetailManager = {
      selectedAnimeId: null,
      previousRoute: "home",
      episodeFilterQuery: "",

      getById(id) { return AnimeDB.find(a => a.id === id) || AnimeDB[0]; },

      generateEpisodes(anime) {
        const list = [];
        const customTitles = anime.episodeTitles || [];
        const cleanDuration = (anime.duration || "24 min").replace("/ ep", "").trim();
        for (let i = 1; i <= anime.episodes; i++) {
          const epLabel = String(i).padStart(2, "0");
          list.push({
            number: i,
            code: `EP ${epLabel}`,
            title: customTitles[i - 1] || `Chapter ${epLabel}: Celestial Convergence`,
            duration: cleanDuration,
            quality: "1080p HD • Multi-Source"
          });
        }
        return list;
      },

      getRelated(anime) {
        return AnimeDB.filter(item => item.id !== anime.id && (item.genres.some(g => anime.genres.includes(g)) || item.type === anime.type)).slice(0, 4);
      },

      open(animeId) {
        if (!["detail", "cinema"].includes(RouterManager.currentRoute)) {
          this.previousRoute = RouterManager.currentRoute;
        }
        this.selectedAnimeId = animeId;
        this.episodeFilterQuery = "";
        RouterManager.navigate("detail");
      },

      render() {
        const anime = this.getById(this.selectedAnimeId);
        const isSaved = WatchlistManager.has(anime.id);
        const allEpisodes = this.generateEpisodes(anime);
        const q = this.episodeFilterQuery.trim().toLowerCase();
        const visibleEpisodes = q
          ? allEpisodes.filter(ep => ep.code.toLowerCase().includes(q) || String(ep.number).includes(q) || ep.title.toLowerCase().includes(q))
          : allEpisodes;
        const related = this.getRelated(anime);

        return `
          <div class="view-section">
            <div class="detail-back-bar">
              <button class="btn-back-nav" id="detailBackBtn">
                <i data-lucide="arrow-left" style="width:16px;height:16px;"></i>
                Back to Previous View
              </button>
              <span class="hero-meta-pill">${anime.type} • ${anime.year}</span>
            </div>

            <section class="detail-hero-card">
              <img src="${anime.backdrop}" alt="" class="detail-backdrop-img" />
              <div class="detail-backdrop-gradient"></div>
              <div class="detail-hero-grid">
                <div class="detail-poster-frame">
                  <img src="${anime.poster}" alt="${anime.title}" />
                </div>
                <div class="detail-main-info">
                  <div class="hero-badge-row" style="margin-bottom:2px;">
                    <span class="badge-featured">${anime.type}</span>
                    <span class="hero-meta-pill" style="color:#F8D26A;">★ ${anime.rating.toFixed(1)} Score</span>
                    <span class="hero-meta-pill">${anime.status}</span>
                  </div>
                  <h1 class="detail-title">${anime.title}</h1>
                  <div class="detail-alt-title">${anime.altTitle}</div>
                  <div class="hero-genres" style="margin-bottom:4px;">
                    ${anime.genres.map(g => `<button class="genre-tag clickable" data-jump-genre="${g}">${g}</button>`).join("")}
                  </div>
                  <div class="detail-specs-grid">
                    <div class="spec-item"><span class="spec-label">Release Year</span><span class="spec-value">${anime.year}</span></div>
                    <div class="spec-item"><span class="spec-label">Episodes</span><span class="spec-value">${anime.episodes} Episodes</span></div>
                    <div class="spec-item"><span class="spec-label">Duration</span><span class="spec-value">${anime.duration}</span></div>
                    <div class="spec-item"><span class="spec-label">Studio</span><span class="spec-value">${anime.studio}</span></div>
                  </div>
                  <p class="detail-synopsis">${anime.synopsis}</p>
                  <div class="hero-actions" style="margin-top:6px;">
                    <button class="btn-primary-luxury" data-play-episode="1" data-id="${anime.id}">
                      <i data-lucide="play" style="width:18px;height:18px;fill:currentColor;"></i>
                      Watch Episode 01
                    </button>
                    <button class="btn-secondary-glass ${isSaved ? "in-library" : ""}" data-action="bookmark" data-id="${anime.id}">
                      <i data-lucide="${isSaved ? "check" : "bookmark-plus"}" style="width:18px;height:18px;"></i>
                      <span>${isSaved ? "In Celestial Library" : "Add to Watchlist"}</span>
                    </button>
                  </div>
                </div>
              </div>
            </section>

            <section class="episodes-panel" aria-label="Episode Directory">
              <div class="episodes-toolbar">
                <div>
                  <span class="section-eyebrow">Transmission Archive</span>
                  <h2 class="section-title">Episodes (${anime.episodes})</h2>
                </div>
                <div class="episode-search-box">
                  <i data-lucide="search"></i>
                  <input type="text" id="episodeFilterInput" class="episode-search-input" placeholder="Find episode number or title..." value="${DiscoverView.escapeHtml(this.episodeFilterQuery)}" />
                </div>
              </div>
              <div class="episode-grid" id="detailEpisodeGrid">
