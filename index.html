                ${this.renderEpisodeCards(anime, visibleEpisodes)}
              </div>
            </section>

            ${related.length > 0 ? `
              <section class="catalog-section">
                <div class="section-header">
                  <div>
                    <span class="section-eyebrow">Aligned Constellations</span>
                    <h2 class="section-title">More Like This</h2>
                  </div>
                </div>
                <div class="poster-grid">
                  ${related.map(item => ComponentRenderer.renderAnimeCard(item)).join("")}
                </div>
              </section>
            ` : ""}
          </div>
        `;
      },

      renderEpisodeCards(anime, episodes) {
        if (episodes.length === 0) {
          return `<div style="grid-column:1/-1;text-align:center;padding:22px;color:var(--platinum-silver);">Tidak ditemukan episode yang sesuai dengan pencarian Anda.</div>`;
        }
        return episodes.map(ep => {
          const watched = HistoryManager.hasWatched(anime.id, ep.number);
          const prog = ContinueWatchingManager.getProgress(anime.id, ep.number);
          const statusTag = prog && prog.percent > 5 && prog.percent < 95
            ? `<span style="color:var(--celestial-blue);font-weight:600;">${prog.percent}%</span>`
            : watched
              ? `<span style="color:#6EE7B7;font-weight:600;">Watched</span>`
              : `<span>${ep.quality}</span>`;

          return `
            <button class="episode-card" data-play-episode="${ep.number}" data-id="${anime.id}">
              <div class="episode-num-box">${String(ep.number).padStart(2, "0")}</div>
              <div class="episode-info">
                <div class="episode-title">${ep.title}</div>
                <div class="episode-submeta"><span>${ep.duration}</span><span>•</span>${statusTag}</div>
              </div>
              <i data-lucide="${watched ? "check-circle-2" : "play-circle"}" style="width:18px;height:18px;color:${watched ? "#6EE7B7" : "var(--celestial-blue)"};flex-shrink:0;"></i>
            </button>
          `;
        }).join("");
      }
    };

    /* 12. SHARED COMPONENT & CATALOG VIEWS */
    const ComponentRenderer = {
      renderAnimeCard(anime, options = {}) {
        const isSaved = WatchlistManager.has(anime.id);
        const rankBadge = options.rank ? `<span class="card-rank-badge">#${String(options.rank).padStart(2, "0")}</span>` : "";
        return `
          <article class="anime-card" data-card-id="${anime.id}">
            <div class="card-poster-wrap">
              <img src="${anime.poster}" alt="${anime.title}" class="card-poster" loading="lazy" />
              <div class="card-top-badges">
                <span class="card-type-badge ${anime.type === "Donghua" ? "donghua" : ""}">${anime.type}</span>
                <span class="card-rating-badge">★ ${anime.rating.toFixed(1)}</span>
              </div>
              ${rankBadge}
              <div class="card-hover-overlay">
                <div class="card-play-circle"><i data-lucide="play" style="width:20px;height:20px;fill:currentColor;margin-left:2px;"></i></div>
              </div>
              <button class="card-bookmark-btn ${isSaved ? "saved" : ""}" data-action="bookmark" data-id="${anime.id}" title="${isSaved ? "Remove from Library" : "Add to Library"}">
                <i data-lucide="${isSaved ? "bookmark-check" : "bookmark"}" style="width:15px;height:15px;"></i>
              </button>
            </div>
            <div class="card-body">
              <h3 class="card-title" title="${anime.title}">${anime.title}</h3>
              <div class="card-genres-line">${anime.genres.slice(0, 3).join(" • ")}</div>
              <div class="card-meta"><span>${anime.year} • ${anime.episodes} Eps</span><span>${anime.status}</span></div>
            </div>
          </article>
        `;
      }
    };

    const HomeView = {
      activeHeroIndex: 0,
      getFeaturedItems() { return AnimeDB.filter(item => item.featured); },
      renderHero(featuredList) {
        const current = featuredList[this.activeHeroIndex] || featuredList[0];
        const isSaved = WatchlistManager.has(current.id);
        return `
          <section class="hero-showcase">
            <img src="${current.backdrop}" alt="${current.title}" class="hero-backdrop" />
            <div class="hero-overlay-horizontal"></div>
            <div class="hero-overlay-vertical"></div>
            <div class="hero-content">
              <div class="hero-info">
                <div class="hero-badge-row">
                  <span class="badge-featured"><i data-lucide="sparkles" style="width:13px;height:13px;"></i>Featured Premiere</span>
                  <span class="hero-meta-pill">${current.type}</span>
                  <span class="hero-meta-pill">${current.year}</span>
                  <span class="hero-meta-pill">${current.status}</span>
                  <span class="hero-meta-pill" style="color:#F8D26A;">★ ${current.rating.toFixed(1)}</span>
                </div>
                <h1 class="hero-title">${current.title}</h1>
                <div class="hero-genres">${current.genres.map(g => `<span class="genre-tag">${g}</span>`).join("")}</div>
                <p class="hero-synopsis">${current.synopsis}</p>
                <div class="hero-actions">
                  <button class="btn-primary-luxury" data-play-episode="1" data-id="${current.id}">
                    <i data-lucide="play" style="width:18px;height:18px;fill:currentColor;"></i>Watch Now
                  </button>
                  <button class="btn-secondary-glass ${isSaved ? "in-library" : ""}" data-action="bookmark" data-id="${current.id}">
                    <i data-lucide="${isSaved ? "check" : "plus"}" style="width:18px;height:18px;"></i>
                    <span>${isSaved ? "In Celestial Library" : "Add to Library"}</span>
                  </button>
                </div>
              </div>
              <div class="hero-selector">
                ${featuredList.map((item, idx) => `
                  <button class="hero-dot-btn ${idx === this.activeHeroIndex ? "active" : ""}" data-hero-idx="${idx}" title="${item.title}">
                    <img src="${item.poster}" alt="${item.title}" loading="lazy" />
                  </button>
                `).join("")}
              </div>
            </div>
          </section>
        `;
      },
      renderRow(eyebrow, title, items, targetRoute = "discover", presetFilter = null) {
        const filterAttrs = presetFilter ? `data-preset-key="${presetFilter.key}" data-preset-val="${presetFilter.val}"` : "";
        return `
          <section class="catalog-section">
            <div class="section-header">
              <div><span class="section-eyebrow">${eyebrow}</span><h2 class="section-title">${title}</h2></div>
              <button class="section-link" data-route="${targetRoute}" ${filterAttrs}>Explore All <i data-lucide="chevron-right" style="width:15px;height:15px;"></i></button>
            </div>
            <div class="poster-grid">${items.map(item => ComponentRenderer.renderAnimeCard(item)).join("")}</div>
          </section>
        `;
      },
      renderContinueSection() {
        const continueList = ContinueWatchingManager.getAll();
        if (continueList.length === 0) {
          return `
            <section class="catalog-section">
              <div class="section-header"><div><span class="section-eyebrow">Personal Telemetry</span><h2 class="section-title">Continue Your Journey</h2></div></div>
              <div class="continue-banner">
                <div style="display:flex;align-items:center;gap:14px;">
                  <div style="width:42px;height:42px;border-radius:12px;background:rgba(131,191,255,0.12);border:1px solid var(--border-celestial);display:flex;align-items:center;justify-content:center;color:var(--celestial-blue);">
                    <i data-lucide="orbit" style="width:20px;height:20px;"></i>
                  </div>
                  <div>
                    <div style="font-family:var(--font-heading);font-weight:600;">Your Astral Log is Ready</div>
                    <div style="font-size:0.82rem;color:var(--platinum-silver);opacity:0.8;">Mulai menonton episode apa pun dan progres Anda akan tersimpan otomatis di sini.</div>
                  </div>
                </div>
                <button class="btn-secondary-glass" data-route="discover" style="padding:10px 18px;font-size:0.83rem;">Open Astral Discover</button>
              </div>
            </section>
          `;
        }
        return `
          <section class="catalog-section">
            <div class="section-header">
              <div><span class="section-eyebrow">Resume Playback</span><h2 class="section-title">Continue Your Journey</h2></div>
              <button class="section-link" data-route="continue">View All <i data-lucide="chevron-right" style="width:15px;height:15px;"></i></button>
            </div>
            <div class="continue-grid">
              ${continueList.slice(0, 3).map(item => CollectionViews.renderContinueCard(item)).join("")}
            </div>
          </section>
        `;
      },
      render() {
        return `
          <div class="view-section">
            ${this.renderHero(this.getFeaturedItems())}
            ${this.renderContinueSection()}
            ${this.renderRow("Orbital Chart", "Trending Across the Universe", AnimeDB.filter(a => a.trending).slice(0, 4), "trending")}
            ${this.renderRow("Fresh Transmissions", "Recently Released", AnimeDB.filter(a => a.recent).slice(0, 4), "discover", { key: "sortBy", val: "latest" })}
            ${this.renderRow("Hall of Legends", "Popular Anime", AnimeDB.filter(a => a.popular).slice(0, 4), "discover", { key: "category", val: "Anime" })}
            ${this.renderRow("Celestial Cultivation", "Donghua Universe", AnimeDB.filter(a => a.type === "Donghua").slice(0, 4), "discover", { key: "category", val: "Donghua" })}
            ${this.renderRow("Curated Selection", "Recommended For You", AnimeDB.filter(a => a.recommended).slice(0, 4), "discover")}
          </div>
        `;
      }
    };

    /* 13. COLLECTION VIEWS (LIBRARY, HISTORY, CONTINUE WATCHING) */
    const CollectionViews = {
      libraryFilter: "ALL",

      renderLibrary() {
        const savedIds = WatchlistManager.getAll();
        let savedItems = savedIds.map(id => AnimeDB.find(a => a.id === id)).filter(Boolean);
        if (this.libraryFilter !== "ALL") {
          savedItems = savedItems.filter(a => a.type === this.libraryFilter);
        }

        return `
          <div class="view-section">
            <div class="discover-hero-header">
              <div>
                <span class="section-eyebrow">Personal Archive • LocalStorage</span>
                <h1 style="font-family:var(--font-heading);font-size:clamp(1.6rem,3vw,2.2rem);font-weight:700;">Celestial Library</h1>
                <p style="font-size:0.86rem;color:var(--platinum-silver);opacity:0.82;">Koleksi Anime & Donghua pilihan yang tersimpan permanen di perangkat Anda.</p>
              </div>
              <div class="category-tabs">
                <button class="category-tab-btn ${this.libraryFilter === "ALL" ? "active" : ""}" data-lib-filter="ALL">All (${savedIds.length})</button>
                <button class="category-tab-btn ${this.libraryFilter === "Anime" ? "active" : ""}" data-lib-filter="Anime">Anime</button>
                <button class="category-tab-btn ${this.libraryFilter === "Donghua" ? "active" : ""}" data-lib-filter="Donghua">Donghua</button>
              </div>
            </div>

            ${savedItems.length === 0 ? `
              <div class="stage-panel">
                <div class="stage-icon-ring"><i data-lucide="bookmark" style="width:26px;height:26px;"></i></div>
                <h2 style="font-family:var(--font-heading);font-size:1.35rem;margin-bottom:8px;">Your Celestial Library is Empty</h2>
                <p style="color:var(--platinum-silver);font-size:0.88rem;margin-bottom:20px;">Simpan seri favorit Anda dengan menekan tombol bookmark pada kartu atau halaman detail.</p>
                <button class="btn-primary-luxury" data-route="discover">Explore Astral Discover</button>
              </div>
            ` : `
              <div class="poster-grid">
                ${savedItems.map(anime => ComponentRenderer.renderAnimeCard(anime)).join("")}
              </div>
            `}
          </div>
        `;
      },

      renderContinueCard(entry) {
        const anime = AnimeDetailManager.getById(entry.animeId);
        const epLabel = String(entry.episode).padStart(2, "0");
        const timeInfo = entry.duration > 0
          ? `${VideoPlayerManager.formatTime(entry.currentTime)} / ${VideoPlayerManager.formatTime(entry.duration)}`
          : `${entry.percent}% watched`;

        return `
          <article class="continue-card">
            <div class="continue-thumb-wrap" data-play-episode="${entry.episode}" data-id="${anime.id}">
              <img src="${anime.backdrop}" alt="${anime.title}" loading="lazy" />
              <div style="position:absolute;inset:0;background:linear-gradient(180deg,transparent 20%,rgba(8,13,25,0.92) 100%);display:flex;align-items:flex-end;justify-content:space-between;padding:12px;">
                <span class="badge-featured">Episode ${epLabel}</span>
                <span class="hero-meta-pill">${timeInfo}</span>
              </div>
              <div class="continue-progress-bar">
                <div class="continue-progress-fill" style="width:${entry.percent}%;"></div>
              </div>
            </div>
            <div class="continue-card-body">
              <div style="font-family:var(--font-heading);font-weight:700;font-size:0.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${anime.title}</div>
              <div style="font-size:0.76rem;color:var(--platinum-silver);opacity:0.75;">Terakhir diputar ${HistoryManager.formatRelativeTime(entry.updatedAt)}</div>
              <div style="display:flex;align-items:center;gap:8px;margin-top:4px;">
                <button class="btn-primary-luxury" data-play-episode="${entry.episode}" data-id="${anime.id}" style="flex:1;justify-content:center;padding:9px 14px;font-size:0.82rem;">
                  <i data-lucide="play" style="width:15px;height:15px;fill:currentColor;"></i> Resume Ep ${epLabel}
                </button>
                <button class="hud-btn" data-remove-continue="${anime.id}" title="Remove from Continue Watching">
                  <i data-lucide="trash-2" style="width:15px;height:15px;color:#FCA5A5;"></i>
                </button>
              </div>
            </div>
          </article>
        `;
      },

      renderContinuePage() {
        const list = ContinueWatchingManager.getAll();
        return `
          <div class="view-section">
            <div class="discover-hero-header">
              <div>
                <span class="section-eyebrow">Playback Telemetry</span>
                <h1 style="font-family:var(--font-heading);font-size:clamp(1.6rem,3vw,2.2rem);font-weight:700;">Continue Watching</h1>
                <p style="font-size:0.86rem;color:var(--platinum-silver);opacity:0.82;">Lanjutkan tontonan terakhir tepat dari posisi detik tersimpan.</p>
              </div>
              ${list.length > 0 ? `<button class="btn-danger-glass" id="clearAllContinueBtn"><i data-lucide="trash-2" style="width:15px;height:15px;"></i>Clear All Progress</button>` : ""}
            </div>

            ${list.length === 0 ? `
              <div class="stage-panel">
                <div class="stage-icon-ring"><i data-lucide="play-circle" style="width:26px;height:26px;"></i></div>
                <h2 style="font-family:var(--font-heading);font-size:1.35rem;margin-bottom:8px;">No Active Playback Sessions</h2>
                <p style="color:var(--platinum-silver);font-size:0.88rem;margin-bottom:20px;">Belum ada episode yang sedang berjalan. Mulai tonton judul pilihan Anda sekarang.</p>
                <button class="btn-primary-luxury" data-route="home">Browse Catalog</button>
              </div>
            ` : `
              <div class="continue-grid">
                ${list.map(entry => this.renderContinueCard(entry)).join("")}
              </div>
            `}
          </div>
        `;
      },

      renderHistoryPage() {
        const list = HistoryManager.getAll();
        return `
          <div class="view-section">
            <div class="discover-hero-header">
              <div>
                <span class="section-eyebrow">Chronological Log</span>
                <h1 style="font-family:var(--font-heading);font-size:clamp(1.6rem,3vw,2.2rem);font-weight:700;">Watch History</h1>
                <p style="font-size:0.86rem;color:var(--platinum-silver);opacity:0.82;">Catatan lengkap episode yang pernah Anda buka di Astral Cinema.</p>
              </div>
              ${list.length > 0 ? `<button class="btn-danger-glass" id="clearAllHistoryBtn"><i data-lucide="trash-2" style="width:15px;height:15px;"></i>Clear History</button>` : ""}
            </div>

            ${list.length === 0 ? `
              <div class="stage-panel">
                <div class="stage-icon-ring"><i data-lucide="history" style="width:26px;height:26px;"></i></div>
                <h2 style="font-family:var(--font-heading);font-size:1.35rem;margin-bottom:8px;">Watch History is Clean</h2>
                <p style="color:var(--platinum-silver);font-size:0.88rem;margin-bottom:20px;">Riwayat tontonan Anda akan tercatat otomatis setiap kali memutar episode.</p>
                <button class="btn-primary-luxury" data-route="discover">Start Watching</button>
              </div>
            ` : `
              <div class="history-list">
                ${list.map(entry => {
                  const anime = AnimeDetailManager.getById(entry.animeId);
                  const epLabel = String(entry.episode).padStart(2, "0");
                  return `
                    <div class="history-row">
                      <div style="display:flex;align-items:center;gap:14px;min-width:0;cursor:pointer;" data-card-id="${anime.id}">
                        <img src="${anime.poster}" alt="${anime.title}" style="width:50px;height:68px;object-fit:cover;border-radius:8px;flex-shrink:0;" />
                        <div style="min-width:0;">
                          <div style="display:flex;align-items:center;gap:8px;margin-bottom:3px;flex-wrap:wrap;">
                            <span class="card-type-badge ${anime.type === "Donghua" ? "donghua" : ""}">${anime.type}</span>
                            <span style="font-size:0.75rem;color:var(--celestial-blue);font-weight:600;">Episode ${epLabel}</span>
                            <span style="font-size:0.74rem;color:var(--platinum-silver);opacity:0.65;">• ${HistoryManager.formatRelativeTime(entry.watchedAt)}</span>
                          </div>
                          <div style="font-family:var(--font-heading);font-weight:600;font-size:1rem;">${anime.title}</div>
                          <div style="font-size:0.76rem;color:var(--platinum-silver);opacity:0.75;">Streamed via ${entry.sourceLabel}</div>
                        </div>
                      </div>
                      <div style="display:flex;align-items:center;gap:8px;">
                        <button class="btn-secondary-glass" data-play-episode="${entry.episode}" data-id="${anime.id}" style="padding:8px 14px;font-size:0.8rem;">
                          <i data-lucide="play" style="width:14px;height:14px;"></i> Watch Again
                        </button>
                        <button class="hud-btn" data-remove-history-id="${anime.id}" data-remove-history-ep="${entry.episode}" title="Remove Entry">
                          <i data-lucide="x" style="width:15px;height:15px;"></i>
                        </button>
                      </div>
                    </div>
                  `;
                }).join("")}
              </div>
            `}
          </div>
        `;
      }
    };

    /* 14. LEVEL 6: PERSONAL SPACE VIEWS (PROFILE & SETTINGS) */
    const PersonalSpaceViews = {
      computeFavoriteGenre() {
        const poolIds = [...WatchlistManager.getAll(), ...HistoryManager.getAll().map(h => h.animeId)];
        if (poolIds.length === 0) return "Cosmic Fantasy";
        const freq = {};
        poolIds.forEach(id => {
          const anime = AnimeDB.find(a => a.id === id);
          if (anime) anime.genres.forEach(g => { freq[g] = (freq[g] || 0) + 1; });
        });
        const sorted = Object.entries(freq).sort((a, b) => b[1] - a[1]);
        return sorted[0] ? sorted[0][0] : "Cosmic Fantasy";
      },

      renderProfile() {
        const cfg = SettingsManager.get();
        const libraryCount = WatchlistManager.getAll().length;
        const historyCount = HistoryManager.getAll().length;
        const continueCount = ContinueWatchingManager.getAll().length;
        const favGenre = this.computeFavoriteGenre();
        const recentHistory = HistoryManager.getAll().slice(0, 4);

        return `
          <div class="view-section">
            <div class="discover-hero-header">
              <div>
                <span class="section-eyebrow">Personal Identity & Telemetry</span>
                <h1 style="font-family:var(--font-heading);font-size:clamp(1.6rem,3vw,2.2rem);font-weight:700;">My Profile</h1>
                <p style="font-size:0.86rem;color:var(--platinum-silver);opacity:0.82;">Statistik perjalanan kosmik dan identitas penjelajah Anda.</p>
              </div>
              <button class="btn-secondary-glass" data-route="settings" style="padding:10px 18px;font-size:0.83rem;">
                <i data-lucide="sliders-horizontal" style="width:16px;height:16px;"></i> Configure Settings
              </button>
            </div>

            <div class="personal-grid">
              <aside class="profile-identity-card">
                <div class="profile-orbit-avatar">${SettingsManager.getInitials(cfg.displayName)}</div>
                <div>
                  <span class="badge-featured" style="margin-bottom:8px;">Sovereign Member</span>
                  <h2 style="font-family:var(--font-heading);font-size:1.35rem;font-weight:700;">${DiscoverView.escapeHtml(cfg.displayName)}</h2>
                </div>
                <p style="font-size:0.84rem;color:var(--platinum-silver);opacity:0.85;line-height:1.6;">
                  ${DiscoverView.escapeHtml(cfg.bio)}
                </p>
                <div style="width:100%;padding-top:14px;border-top:1px solid var(--border-subtle);display:flex;flex-direction:column;gap:8px;text-align:left;font-size:0.8rem;">
                  <div style="display:flex;justify-content:space-between;"><span style="color:var(--platinum-silver);opacity:0.75;">Favorite Genre</span><strong style="color:var(--celestial-blue);">${favGenre}</strong></div>
                  <div style="display:flex;justify-content:space-between;"><span style="color:var(--platinum-silver);opacity:0.75;">Preferred Server</span><strong>${cfg.defaultSource}</strong></div>
                  <div style="display:flex;justify-content:space-between;"><span style="color:var(--platinum-silver);opacity:0.75;">Subtitle Default</span><strong>${cfg.defaultSubtitle.toUpperCase()}</strong></div>
                </div>
              </aside>

              <div>
                <div class="stats-quad-grid">
                  <div class="stat-box">
                    <span class="stat-num">${libraryCount}</span>
                    <span class="stat-title">Saved in Library</span>
                  </div>
                  <div class="stat-box">
                    <span class="stat-num">${historyCount}</span>
                    <span class="stat-title">Episodes Watched</span>
                  </div>
                  <div class="stat-box">
                    <span class="stat-num">${continueCount}</span>
                    <span class="stat-title">Active Progress</span>
                  </div>
                  <div class="stat-box">
                    <span class="stat-num">${AnimeDB.length}</span>
                    <span class="stat-title">Universe Catalog</span>
                  </div>
                </div>

                <div class="settings-card">
                  <div style="display:flex;justify-content:space-between;align-items:center;">
                    <div>
                      <span class="section-eyebrow">Recent Activity</span>
                      <h3 style="font-family:var(--font-heading);font-size:1.15rem;font-weight:700;">Latest Transmissions Watched</h3>
                    </div>
                    <button class="section-link" data-route="history">Full History <i data-lucide="chevron-right" style="width:15px;height:15px;"></i></button>
                  </div>

                  ${recentHistory.length === 0 ? `
                    <div style="padding:18px;text-align:center;color:var(--platinum-silver);font-size:0.86rem;">
                      Belum ada aktivitas tontonan terbaru. Mulai eksplorasi dari beranda.
                    </div>
                  ` : `
                    <div style="display:flex;flex-direction:column;gap:10px;">
                      ${recentHistory.map(item => {
                        const anime = AnimeDetailManager.getById(item.animeId);
                        return `
                          <div class="history-row" style="padding:11px 14px;">
                            <div style="min-width:0;">
                              <div style="font-family:var(--font-heading);font-weight:600;font-size:0.92rem;">${anime.title}</div>
                              <div style="font-size:0.75rem;color:var(--celestial-blue);">Episode ${String(item.episode).padStart(2, "0")} • ${HistoryManager.formatRelativeTime(item.watchedAt)}</div>
                            </div>
                            <button class="btn-secondary-glass" data-play-episode="${item.episode}" data-id="${anime.id}" style="padding:7px 12px;font-size:0.78rem;">Resume</button>
                          </div>
                        `;
                      }).join("")}
                    </div>
                  `}
                </div>
              </div>
            </div>
          </div>
        `;
      },

      renderSettings() {
        const cfg = SettingsManager.get();
        return `
          <div class="view-section">
            <div class="discover-hero-header">
              <div>
                <span class="section-eyebrow">System & Playback Configuration</span>
                <h1 style="font-family:var(--font-heading);font-size:clamp(1.6rem,3vw,2.2rem);font-weight:700;">Settings</h1>
                <p style="font-size:0.86rem;color:var(--platinum-silver);opacity:0.82;">Sesuaikan identitas profil, pemutar video default, dan cadangan data lokal.</p>
              </div>
              <span class="badge-featured">Cosmic Core ${AppConfig.version}</span>
            </div>

            <div class="settings-card">
              <div>
                <span class="section-eyebrow">Identity Configuration</span>
                <h2 style="font-family:var(--font-heading);font-size:1.18rem;font-weight:700;">Voyager Profile</h2>
              </div>
              <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;">
                <div class="filter-field">
                  <label class="filter-label" for="settingDisplayNameInput">Display Name</label>
                  <input type="text" id="settingDisplayNameInput" class="cosmic-input" value="${DiscoverView.escapeHtml(cfg.displayName)}" maxlength="32" />
                </div>
                <div class="filter-field">
                  <label class="filter-label" for="settingBioInput">Cosmic Bio</label>
                  <input type="text" id="settingBioInput" class="cosmic-input" value="${DiscoverView.escapeHtml(cfg.bio)}" maxlength="120" />
                </div>
              </div>
              <div>
                <button class="btn-primary-luxury" id="saveProfileSettingsBtn" style="padding:10px 20px;font-size:0.84rem;">
                  <i data-lucide="save" style="width:16px;height:16px;"></i> Save Profile Identity
                </button>
              </div>
            </div>

            <div class="settings-card">
              <div>
                <span class="section-eyebrow">Astral Cinema Engine</span>
                <h2 style="font-family:var(--font-heading);font-size:1.18rem;font-weight:700;">Playback & Visual Preferences</h2>
              </div>

              <div class="setting-row">
                <div>
                  <div style="font-family:var(--font-heading);font-weight:600;font-size:0.95rem;">Default Video Source</div>
                  <div style="font-size:0.8rem;color:var(--platinum-silver);opacity:0.78;">Server atau provider yang langsung dimuat saat membuka episode baru.</div>
                </div>
                <select id="settingDefaultSourceSelect" class="cosmic-select" style="width:230px;">
                  ${VideoSourceManager.providers.map(p => `<option value="${p.id}" ${cfg.defaultSource === p.id ? "selected" : ""}>${p.label}</option>`).join("")}
                </select>
              </div>

              <div class="setting-row">
                <div>
                  <div style="font-family:var(--font-heading);font-weight:600;font-size:0.95rem;">Default Subtitle Language</div>
                  <div style="font-size:0.8rem;color:var(--platinum-silver);opacity:0.78;">Bahasa subtitle aktif pada pemutar HTML5 & HLS.</div>
                </div>
                <select id="settingDefaultSubtitleSelect" class="cosmic-select" style="width:230px;">
                  <option value="id" ${cfg.defaultSubtitle === "id" ? "selected" : ""}>Indonesia (Sub ID)</option>
                  <option value="en" ${cfg.defaultSubtitle === "en" ? "selected" : ""}>English (Sub EN)</option>
                  <option value="off" ${cfg.defaultSubtitle === "off" ? "selected" : ""}>Off</option>
                </select>
              </div>

              <div class="setting-row">
                <div>
                  <div style="font-family:var(--font-heading);font-weight:600;font-size:0.95rem;">Auto-Next Episode</div>
                  <div style="font-size:0.8rem;color:var(--platinum-silver);opacity:0.78;">Otomatis memutar episode berikutnya ketika video selesai.</div>
                </div>
                <button class="toggle-switch ${cfg.autoNext ? "on" : ""}" id="toggleAutoNextSetting" aria-label="Toggle Auto Next"></button>
              </div>

              <div class="setting-row">
                <div>
                  <div style="font-family:var(--font-heading);font-weight:600;font-size:0.95rem;">Ambient Starfield Matrix</div>
                  <div style="font-size:0.8rem;color:var(--platinum-silver);opacity:0.78;">Tampilkan titik-titik bintang halus pada latar belakang Cosmic Luxury.</div>
                </div>
                <button class="toggle-switch ${cfg.starfieldEnabled ? "on" : ""}" id="toggleStarfieldSetting" aria-label="Toggle Starfield"></button>
              </div>
            </div>

            <div class="settings-card">
              <div>
                <span class="section-eyebrow">Data Sovereignty</span>
                <h2 style="font-family:var(--font-heading);font-size:1.18rem;font-weight:700;">Backup, Restore & Reset</h2>
              </div>
              <p style="font-size:0.83rem;color:var(--platinum-silver);opacity:0.82;">
                Seluruh koleksi, riwayat tontonan, dan progres disimpan secara lokal di perangkat Anda. Ekspor ke JSON kapan saja untuk cadangan lintas perangkat.
              </p>
              <div style="display:flex;flex-wrap:wrap;gap:12px;">
                <button class="btn-secondary-glass" id="exportBackupBtn" style="padding:10px 18px;font-size:0.83rem;">
                  <i data-lucide="download" style="width:16px;height:16px;"></i> Export JSON Backup
                </button>
                <button class="btn-secondary-glass" id="triggerImportBackupBtn" style="padding:10px 18px;font-size:0.83rem;">
                  <i data-lucide="upload" style="width:16px;height:16px;"></i> Import JSON Backup
                </button>
                <button class="btn-danger-glass" id="factoryResetBtn" style="padding:10px 18px;font-size:0.83rem;">
                  <i data-lucide="rotate-ccw" style="width:16px;height:16px;"></i> Reset All Local Data
                </button>
              </div>
            </div>
          </div>
        `;
      }
    };

    const DiscoverView = {
      escapeHtml(str) {
        return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      },
      render() {
        const s = FilterManager.state;
        const results = FilterManager.apply();
        const allGenres = FilterManager.getAllGenres();
        const allYears = FilterManager.getAllYears();
        const totalAll = AnimeDB.length;
        const totalAnime = AnimeDB.filter(a => a.type === "Anime").length;
        const totalDonghua = AnimeDB.filter(a => a.type === "Donghua").length;

        return `
          <div class="view-section">
            <div class="discover-hero-header">
              <div>
                <span class="section-eyebrow">Cosmic Catalog Explorer</span>
                <h1 style="font-family:var(--font-heading);font-size:clamp(1.6rem,3vw,2.2rem);font-weight:700;">Astral Discover</h1>
                <p style="font-size:0.86rem;color:var(--platinum-silver);opacity:0.82;">Telusuri semesta Anime & Donghua dengan pencarian real-time, filter multi-dimensi, dan penyortiran presisi.</p>
              </div>
              <span class="badge-featured">${totalAll} Curated Titles</span>
            </div>

            <div class="discover-controls-panel">
              <div class="discover-top-bar">
                <div class="category-tabs">
                  <button class="category-tab-btn ${s.category === "ALL" ? "active" : ""}" data-filter-category="ALL">All <span class="tab-count">${totalAll}</span></button>
                  <button class="category-tab-btn ${s.category === "Anime" ? "active" : ""}" data-filter-category="Anime">Anime <span class="tab-count">${totalAnime}</span></button>
                  <button class="category-tab-btn ${s.category === "Donghua" ? "active" : ""}" data-filter-category="Donghua">Donghua <span class="tab-count">${totalDonghua}</span></button>
                </div>
                <div class="discover-search-wrap">
                  <i data-lucide="search"></i>
                  <input type="text" id="discoverSearchInput" class="discover-search-input" placeholder="Filter by title, alt title, or keyword..." value="${this.escapeHtml(s.query)}" autocomplete="off" />
                  ${s.query ? `<button class="clear-search-btn" id="clearDiscoverSearchBtn"><i data-lucide="x" style="width:15px;height:15px;"></i></button>` : ""}
                </div>
              </div>

              <div class="filter-dropdowns-row">
                <div class="filter-field">
                  <label class="filter-label" for="filterGenreSelect">Genre</label>
                  <select id="filterGenreSelect" class="cosmic-select">
                    <option value="ALL" ${s.genre === "ALL" ? "selected" : ""}>All Genres</option>
                    ${allGenres.map(g => `<option value="${g}" ${s.genre === g ? "selected" : ""}>${g}</option>`).join("")}
                  </select>
                </div>
                <div class="filter-field">
                  <label class="filter-label" for="filterYearSelect">Release Year</label>
                  <select id="filterYearSelect" class="cosmic-select">
                    <option value="ALL" ${s.year === "ALL" ? "selected" : ""}>All Years</option>
                    ${allYears.map(y => `<option value="${y}" ${String(s.year) === String(y) ? "selected" : ""}>${y}</option>`).join("")}
                  </select>
                </div>
                <div class="filter-field">
                  <label class="filter-label" for="filterStatusSelect">Release Status</label>
                  <select id="filterStatusSelect" class="cosmic-select">
                    <option value="ALL" ${s.status === "ALL" ? "selected" : ""}>All Status</option>
                    <option value="Ongoing" ${s.status === "Ongoing" ? "selected" : ""}>Ongoing</option>
                    <option value="Completed" ${s.status === "Completed" ? "selected" : ""}>Completed</option>
                  </select>
                </div>
                <div class="filter-field">
                  <label class="filter-label" for="filterSortSelect">Sort By</label>
                  <select id="filterSortSelect" class="cosmic-select">
                    <option value="popularity" ${s.sortBy === "popularity" ? "selected" : ""}>Popularity (Default)</option>
                    <option value="latest" ${s.sortBy === "latest" ? "selected" : ""}>Latest Release</option>
                    <option value="rating" ${s.sortBy === "rating" ? "selected" : ""}>Highest Rating</option>
                    <option value="title" ${s.sortBy === "title" ? "selected" : ""}>Alphabetical (A–Z)</option>
                  </select>
                </div>
              </div>

              <div class="genre-chips-bar">
                <button class="genre-chip ${s.genre === "ALL" ? "active" : ""}" data-chip-genre="ALL">All Genres</button>
                ${allGenres.map(g => `<button class="genre-chip ${s.genre === g ? "active" : ""}" data-chip-genre="${g}">${g}</button>`).join("")}
              </div>
            </div>

            <div class="results-status-bar">
              <div>Menampilkan <strong style="color:var(--starlight-white);">${results.length}</strong> dari ${totalAll} judul ${s.query ? `untuk "<span style="color:var(--celestial-blue);">${this.escapeHtml(s.query)}</span>"` : ""}</div>
              ${FilterManager.hasActiveFilters() ? `<button class="btn-reset-filters" id="resetAllFiltersBtn"><i data-lucide="rotate-ccw" style="width:14px;height:14px;"></i>Reset Filters</button>` : ""}
            </div>

            <div id="discoverGridContainer">${this.renderResultsGrid(results)}</div>
          </div>
        `;
      },
      renderResultsGrid(results) {
        if (results.length === 0) {
          return `
            <div class="stage-panel" style="margin:24px auto;">
              <div class="stage-icon-ring"><i data-lucide="telescope" style="width:26px;height:26px;"></i></div>
              <h2 style="font-family:var(--font-heading);font-size:1.3rem;margin-bottom:8px;">No Celestial Signals Found</h2>
              <p style="color:var(--platinum-silver);font-size:0.86rem;margin-bottom:18px;">Tidak ada judul yang cocok dengan kombinasi pencarian dan filter Anda.</p>
              <button class="btn-primary-luxury" id="emptyResetFiltersBtn" style="padding:10px 20px;font-size:0.85rem;">Reset All Filters</button>
            </div>
          `;
        }
        return `<div class="poster-grid">${results.map(anime => ComponentRenderer.renderAnimeCard(anime)).join("")}</div>`;
      },
      updateGridOnly() {
        const container = document.getElementById("discoverGridContainer");
        if (!container) return;
        const results = FilterManager.apply();
        container.innerHTML = this.renderResultsGrid(results);
        const statusBar = document.querySelector(".results-status-bar");
        if (statusBar) {
          const s = FilterManager.state;
          statusBar.innerHTML = `
            <div>Menampilkan <strong style="color:var(--starlight-white);">${results.length}</strong> dari ${AnimeDB.length} judul ${s.query ? `untuk "<span style="color:var(--celestial-blue);">${this.escapeHtml(s.query)}</span>"` : ""}</div>
            ${FilterManager.hasActiveFilters() ? `<button class="btn-reset-filters" id="resetAllFiltersBtn"><i data-lucide="rotate-ccw" style="width:14px;height:14px;"></i>Reset Filters</button>` : ""}
          `;
        }
        if (window.lucide) window.lucide.createIcons();
      }
    };

    const TrendingView = {
      render() {
        const rankedList = [...AnimeDB].sort((a, b) => b.popularityScore - a.popularityScore).slice(0, 8);
        return `
          <div class="view-section">
            <div class="discover-hero-header">
              <div>
                <span class="section-eyebrow">Orbital Telemetry • Top Ranked</span>
                <h1 style="font-family:var(--font-heading);font-size:clamp(1.6rem,3vw,2.2rem);font-weight:700;">Trending Across the Universe</h1>
                <p style="font-size:0.86rem;color:var(--platinum-silver);opacity:0.82;">Judul Anime & Donghua dengan resonansi tertinggi di SOVEREIGN ASTRA.</p>
              </div>
              <button class="btn-secondary-glass" data-route="discover" style="padding:10px 18px;font-size:0.83rem;">Filter Full Catalog</button>
            </div>
            <div class="poster-grid">${rankedList.map((anime, idx) => ComponentRenderer.renderAnimeCard(anime, { rank: idx + 1 })).join("")}</div>
          </div>
        `;
      }
    };

    const ScheduleView = {
      selectedDay: "ALL",
      days: ["ALL", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
      render() {
        const entries = AnimeDB.filter(item => this.selectedDay === "ALL" ? true : item.releaseDay === this.selectedDay);
        return `
          <div class="view-section">
            <div class="discover-hero-header">
              <div>
                <span class="section-eyebrow">Local Configuration Schedule</span>
                <h1 style="font-family:var(--font-heading);font-size:clamp(1.6rem,3vw,2.2rem);font-weight:700;">Release Schedule</h1>
                <p style="font-size:0.86rem;color:var(--platinum-silver);opacity:0.82;">Jadwal rilis episode mingguan berdasarkan konfigurasi katalog lokal.</p>
              </div>
              <span class="badge-featured">Season 2026 Lineup</span>
            </div>
            <div class="day-selector-bar">
              ${this.days.map(day => `<button class="day-pill-btn ${this.selectedDay === day ? "active" : ""}" data-schedule-day="${day}">${day === "ALL" ? "All Week" : day}</button>`).join("")}
            </div>
            <div class="schedule-list">
              ${entries.map((anime, idx) => `
                <div class="schedule-row" data-card-id="${anime.id}">
                  <div style="display:flex;align-items:center;gap:14px;min-width:0;">
                    <img src="${anime.poster}" alt="${anime.title}" style="width:50px;height:68px;object-fit:cover;border-radius:8px;flex-shrink:0;" />
                    <div style="min-width:0;">
                      <div style="display:flex;align-items:center;gap:8px;margin-bottom:3px;">
                        <span class="card-type-badge ${anime.type === "Donghua" ? "donghua" : ""}">${anime.type}</span>
                        <span style="font-size:0.76rem;color:var(--celestial-blue);font-weight:600;">${anime.releaseDay} • ${anime.releaseTime}</span>
                      </div>
                      <div style="font-family:var(--font-heading);font-weight:600;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${anime.title}</div>
                      <div style="font-size:0.78rem;color:var(--platinum-silver);opacity:0.78;">Episode ${String((idx % anime.episodes) + 1).padStart(2, "0")} • ${anime.studio}</div>
                    </div>
                  </div>
                  <span class="hero-meta-pill" style="flex-shrink:0;">${anime.status}</span>
                </div>
              `).join("")}
            </div>
          </div>
        `;
      }
    };

    /* 15. ROUTER MANAGER */
    const RouterManager = {
      currentRoute: "home",
      navigate(route) {
        if (this.currentRoute === "cinema" && route !== "cinema") {
          VideoPlayerManager.cleanup();
        }
        this.currentRoute = route;
        const navHighlight = (route === "detail" || route === "cinema") ? AnimeDetailManager.previousRoute : route;
        NavigationManager.setActiveRoute(navHighlight);
        NavigationManager.closeMobileDrawer();

        const viewport = document.getElementById("appViewport");
        if (!viewport) return;

        if (route === "home") viewport.innerHTML = HomeView.render();
        else if (route === "discover") { viewport.innerHTML = DiscoverView.render(); this.bindDiscoverEvents(); }
        else if (route === "trending") viewport.innerHTML = TrendingView.render();
        else if (route === "schedule") viewport.innerHTML = ScheduleView.render();
        else if (route === "library") viewport.innerHTML = CollectionViews.renderLibrary();
        else if (route === "history") viewport.innerHTML = CollectionViews.renderHistoryPage();
        else if (route === "continue") viewport.innerHTML = CollectionViews.renderContinuePage();
        else if (route === "profile") viewport.innerHTML = PersonalSpaceViews.renderProfile();
        else if (route === "settings") { viewport.innerHTML = PersonalSpaceViews.renderSettings(); this.bindSettingsEvents(); }
        else if (route === "detail") { viewport.innerHTML = AnimeDetailManager.render(); this.bindDetailEvents(); }
        else if (route === "cinema") {
          viewport.innerHTML = VideoPlayerManager.render();
          if (window.lucide) window.lucide.createIcons();
          VideoPlayerManager.mountEngine();
          window.scrollTo({ top: 0, behavior: "smooth" });
          return;
        }
        if (window.lucide) window.lucide.createIcons();
        window.scrollTo({ top: 0, behavior: "smooth" });
      },
      bindDiscoverEvents() {
        const discoverInput = document.getElementById("discoverSearchInput");
        const headerInput = document.getElementById("headerSearchInput");
        discoverInput?.addEventListener("input", (e) => {
          FilterManager.state.query = e.target.value;
          if (headerInput) headerInput.value = e.target.value;
          DiscoverView.updateGridOnly();
        });
        document.getElementById("filterGenreSelect")?.addEventListener("change", (e) => { FilterManager.state.genre = e.target.value; this.navigate("discover"); });
        document.getElementById("filterYearSelect")?.addEventListener("change", (e) => { FilterManager.state.year = e.target.value; this.navigate("discover"); });
        document.getElementById("filterStatusSelect")?.addEventListener("change", (e) => { FilterManager.state.status = e.target.value; this.navigate("discover"); });
        document.getElementById("filterSortSelect")?.addEventListener("change", (e) => { FilterManager.state.sortBy = e.target.value; this.navigate("discover"); });
      },
      bindDetailEvents() {
        document.getElementById("episodeFilterInput")?.addEventListener("input", (e) => {
          AnimeDetailManager.episodeFilterQuery = e.target.value;
          const anime = AnimeDetailManager.getById(AnimeDetailManager.selectedAnimeId);
          const allEpisodes = AnimeDetailManager.generateEpisodes(anime);
          const q = e.target.value.trim().toLowerCase();
          const filtered = q ? allEpisodes.filter(ep => ep.code.toLowerCase().includes(q) || String(ep.number).includes(q) || ep.title.toLowerCase().includes(q)) : allEpisodes;
          const grid = document.getElementById("detailEpisodeGrid");
          if (grid) {
            grid.innerHTML = AnimeDetailManager.renderEpisodeCards(anime, filtered);
            if (window.lucide) window.lucide.createIcons({ nodes: [grid] });
          }
        });
      },
      bindSettingsEvents() {
        document.getElementById("settingDefaultSourceSelect")?.addEventListener("change", (e) => {
          SettingsManager.update({ defaultSource: e.target.value });
          NotificationManager.show("Default video source diperbarui.", "tv");
        });
        document.getElementById("settingDefaultSubtitleSelect")?.addEventListener("change", (e) => {
          SettingsManager.update({ defaultSubtitle: e.target.value });
          NotificationManager.show("Default subtitle diperbarui.", "subtitles");
        });
      }
    };

    /* 16. NAVIGATION MANAGER */
    const NavigationManager = {
      resetConfirmPending: false,

      init() {
        const sidebar = document.getElementById("appSidebar");
        const backdrop = document.getElementById("drawerBackdrop");
        const headerSearchInput = document.getElementById("headerSearchInput");
        const importInput = document.getElementById("importBackupInput");

        if (StorageManager.get(AppConfig.storageKeys.sidebarCollapsed, false) && window.innerWidth > 768) {
          sidebar.classList.add("collapsed");
          document.body.classList.add("sidebar-is-collapsed");
        }

        document.getElementById("sidebarCollapseBtn")?.addEventListener("click", () => {
          const collapsed = sidebar.classList.toggle("collapsed");
          document.body.classList.toggle("sidebar-is-collapsed", collapsed);
          StorageManager.set(AppConfig.storageKeys.sidebarCollapsed, collapsed);
        });

        document.getElementById("mobileMenuBtn")?.addEventListener("click", () => {
          sidebar.classList.add("mobile-open");
          backdrop.classList.add("visible");
        });

        backdrop?.addEventListener("click", () => this.closeMobileDrawer());

        importInput?.addEventListener("change", (e) => {
          const file = e.target.files?.[0];
          if (file) SettingsManager.importBackup(file);
          importInput.value = "";
        });

        headerSearchInput?.addEventListener("input", (e) => {
          const val = e.target.value;
          FilterManager.state.query = val;
          if (RouterManager.currentRoute !== "discover") {
            RouterManager.navigate("discover");
            const discoverInput = document.getElementById("discoverSearchInput");
            if (discoverInput) { discoverInput.focus(); discoverInput.setSelectionRange(val.length, val.length); }
          } else {
            const discoverInput = document.getElementById("discoverSearchInput");
            if (discoverInput && discoverInput.value !== val) discoverInput.value = val;
            DiscoverView.updateGridOnly();
          }
        });

        document.addEventListener("click", (e) => {
          const heroDot = e.target.closest("[data-hero-idx]");
          if (heroDot) { HomeView.activeHeroIndex = Number(heroDot.dataset.heroIdx); RouterManager.navigate("home"); return; }

          if (e.target.closest("#detailBackBtn")) { RouterManager.navigate(AnimeDetailManager.previousRoute || "home"); return; }

          if (e.target.closest("#cinemaBackToDetailBtn")) {
            AnimeDetailManager.open(VideoPlayerManager.activeAnimeId);
            return;
          }

          // Level 6 Settings & Profile Controls
          if (e.target.closest("#saveProfileSettingsBtn")) {
            const nameVal = document.getElementById("settingDisplayNameInput")?.value.trim() || "Astral Voyager";
            const bioVal = document.getElementById("settingBioInput")?.value.trim() || SettingsManager.defaults.bio;
            SettingsManager.update({ displayName: nameVal, bio: bioVal });
            NotificationManager.show("Profil Astral Voyager berhasil disimpan.", "user-check");
            return;
          }

          if (e.target.closest("#toggleAutoNextSetting")) {
            const current = SettingsManager.get().autoNext;
            SettingsManager.update({ autoNext: !current });
            RouterManager.navigate("settings");
            return;
          }

          if (e.target.closest("#toggleStarfieldSetting")) {
            const current = SettingsManager.get().starfieldEnabled;
            SettingsManager.update({ starfieldEnabled: !current });
            RouterManager.navigate("settings");
            return;
          }

          if (e.target.closest("#exportBackupBtn")) {
            SettingsManager.exportBackup();
            return;
          }

          if (e.target.closest("#triggerImportBackupBtn")) {
            importInput?.click();
            return;
          }

          const resetBtn = e.target.closest("#factoryResetBtn");
          if (resetBtn) {
            if (!this.resetConfirmPending) {
              this.resetConfirmPending = true;
              resetBtn.innerHTML = `<i data-lucide="alert-triangle" style="width:16px;height:16px;"></i> Click Again to Confirm Reset`;
              if (window.lucide) window.lucide.createIcons({ nodes: [resetBtn] });
              setTimeout(() => { this.resetConfirmPending = false; }, 4000);
            } else {
              this.resetConfirmPending = false;
              SettingsManager.factoryReset();
            }
            return;
          }

          // Level 5 Collection Controls
          const libFilterBtn = e.target.closest("[data-lib-filter]");
          if (libFilterBtn) {
            CollectionViews.libraryFilter = libFilterBtn.dataset.libFilter;
            RouterManager.navigate("library");
            return;
          }

          const remContinueBtn = e.target.closest("[data-remove-continue]");
          if (remContinueBtn) {
            ContinueWatchingManager.remove(remContinueBtn.dataset.removeContinue);
            NotificationManager.show("Dihapus dari Continue Watching.", "trash-2");
            RouterManager.navigate(RouterManager.currentRoute);
            return;
          }

          if (e.target.closest("#clearAllContinueBtn")) {
            ContinueWatchingManager.clearAll();
            NotificationManager.show("Seluruh progres Continue Watching dibersihkan.", "trash-2");
            RouterManager.navigate("continue");
            return;
          }

          const remHistoryBtn = e.target.closest("[data-remove-history-id]");
          if (remHistoryBtn) {
            HistoryManager.remove(remHistoryBtn.dataset.removeHistoryId, remHistoryBtn.dataset.removeHistoryEp);
            NotificationManager.show("Item riwayat dihapus.", "x");
            RouterManager.navigate("history");
            return;
          }

          if (e.target.closest("#clearAllHistoryBtn")) {
            HistoryManager.clearAll();
            NotificationManager.show("Seluruh Watch History dibersihkan.", "trash-2");
            RouterManager.navigate("history");
            return;
          }

          // Cinema Source Switcher
          const switchSrcBtn = e.target.closest("[data-switch-source]");
          if (switchSrcBtn) {
            VideoPlayerManager.cleanup();
            VideoPlayerManager.activeSourceId = switchSrcBtn.dataset.switchSource;
            const srcObj = VideoSourceManager.providers.find(p => p.id === VideoPlayerManager.activeSourceId);
            if (srcObj) HistoryManager.record(VideoPlayerManager.activeAnimeId, VideoPlayerManager.activeEpisode, srcObj.providerName);
            RouterManager.navigate("cinema");
            return;
          }

          if (e.target.closest("#playerFallbackBtn")) {
            VideoPlayerManager.switchToFallback();
            return;
          }

          if (e.target.closest("#hudTheaterBtn")) {
            VideoPlayerManager.theaterMode = !VideoPlayerManager.theaterMode;
            document.getElementById("cinemaLayoutGrid")?.classList.toggle("theater-active", VideoPlayerManager.theaterMode);
            e.target.closest("#hudTheaterBtn").classList.toggle("active", VideoPlayerManager.theaterMode);
            return;
          }

          if (e.target.closest("#hudFullscreenBtn")) {
            const vp = document.getElementById("playerViewport");
            if (vp && !document.fullscreenElement) vp.requestFullscreen?.().catch(() => {});
            else if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
            return;
          }

          if (e.target.closest("#cinemaAutoNextBtn")) {
            VideoPlayerManager.autoNext = !VideoPlayerManager.autoNext;
            const btn = e.target.closest("#cinemaAutoNextBtn");
            btn.classList.toggle("in-library", VideoPlayerManager.autoNext);
            btn.innerHTML = `<i data-lucide="repeat" style="width:15px;height:15px;"></i> Auto-Next: ${VideoPlayerManager.autoNext ? "ON" : "OFF"}`;
            if (window.lucide) window.lucide.createIcons({ nodes: [btn] });
            return;
          }

          if (e.target.closest("#cinemaPrevEpBtn") && VideoPlayerManager.activeEpisode > 1) {
            VideoPlayerManager.open(VideoPlayerManager.activeAnimeId, VideoPlayerManager.activeEpisode - 1);
            return;
          }

          if (e.target.closest("#cinemaNextEpBtn")) {
            const anime = AnimeDetailManager.getById(VideoPlayerManager.activeAnimeId);
            if (VideoPlayerManager.activeEpisode < anime.episodes) {
              VideoPlayerManager.open(VideoPlayerManager.activeAnimeId, VideoPlayerManager.activeEpisode + 1);
            }
            return;
          }

          const jumpGenre = e.target.closest("[data-jump-genre]");
          if (jumpGenre) { FilterManager.reset(); FilterManager.state.genre = jumpGenre.dataset.jumpGenre; RouterManager.navigate("discover"); return; }

          const playEpBtn = e.target.closest("[data-play-episode]");
          if (playEpBtn) {
            e.stopPropagation();
            const animeId = playEpBtn.dataset.id;
            const epNum = Number(playEpBtn.dataset.playEpisode) || 1;
            if (!["detail", "cinema"].includes(RouterManager.currentRoute)) {
              AnimeDetailManager.previousRoute = RouterManager.currentRoute;
            }
            AnimeDetailManager.selectedAnimeId = animeId;
            VideoPlayerManager.open(animeId, epNum);
            return;
          }

          const scheduleDayBtn = e.target.closest("[data-schedule-day]");
          if (scheduleDayBtn) { ScheduleView.selectedDay = scheduleDayBtn.dataset.scheduleDay; RouterManager.navigate("schedule"); return; }

          const catTab = e.target.closest("[data-filter-category]");
          if (catTab) { FilterManager.state.category = catTab.dataset.filterCategory; RouterManager.navigate("discover"); return; }

          const genreChip = e.target.closest("[data-chip-genre]");
          if (genreChip) { FilterManager.state.genre = genreChip.dataset.chipGenre; RouterManager.navigate("discover"); return; }

          if (e.target.closest("#clearDiscoverSearchBtn")) { FilterManager.state.query = ""; if (headerSearchInput) headerSearchInput.value = ""; RouterManager.navigate("discover"); return; }

          if (e.target.closest("#resetAllFiltersBtn") || e.target.closest("#emptyResetFiltersBtn")) {
            FilterManager.reset(); RouterManager.navigate("discover");
            NotificationManager.show("Seluruh filter Astral Discover telah diatur ulang.", "rotate-ccw");
            return;
          }

          const bookmarkBtn = e.target.closest('[data-action="bookmark"]');
          if (bookmarkBtn) {
            e.stopPropagation();
            const animeId = bookmarkBtn.dataset.id;
            const anime = AnimeDB.find(a => a.id === animeId);
            const added = WatchlistManager.toggle(animeId);
            NotificationManager.show(added ? `Ditambahkan ke Celestial Library: ${anime?.title}` : `Dihapus dari Celestial Library: ${anime?.title}`, added ? "bookmark-check" : "bookmark-minus");
            if (["home", "discover", "trending", "detail", "library"].includes(RouterManager.currentRoute)) RouterManager.navigate(RouterManager.currentRoute);
            return;
          }

          const routeTrigger = e.target.closest("[data-route]");
          if (routeTrigger) {
            e.preventDefault();
            const targetRoute = routeTrigger.dataset.route;
            const presetKey = routeTrigger.dataset.presetKey;
            const presetVal = routeTrigger.dataset.presetVal;
            if (targetRoute === "discover" && presetKey && presetVal) { FilterManager.reset(); FilterManager.state[presetKey] = presetVal; }
            RouterManager.navigate(targetRoute);
            return;
          }

          const card = e.target.closest("[data-card-id]");
          if (card) { AnimeDetailManager.open(card.dataset.cardId); }
        });
      },
      setActiveRoute(route) {
        document.querySelectorAll(".nav-item[data-route]").forEach(btn => btn.classList.toggle("active", btn.dataset.route === route));
      },
      closeMobileDrawer() {
        document.getElementById("appSidebar")?.classList.remove("mobile-open");
        document.getElementById("drawerBackdrop")?.classList.remove("visible");
      }
    };

    /* 17. APPLICATION INITIALIZATION */
    document.addEventListener("DOMContentLoaded", () => {
      SettingsManager.applyToDOM();
      WatchlistManager.updateBadge();
      NavigationManager.init();
      RouterManager.navigate("home");
    });
  </script>
</body>
</html>
